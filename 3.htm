<script>
(function(){
  'use strict';

  var ADMIN = 'owner';
  var GOALS = { views:4000000000, followers:1000000, likes:50000000, comments:1000000, shares:100 };

  function cloud(){ return !!(window.VXC && VXC.on && VXC.fs && VXC.uid); }
  function iAmAdmin(){ return !!(window.VXC && VXC.on && VXC.admin); }
  function D(){ return VXC.fs; }
  function FV(){ return firebase.firestore.FieldValue; }
  function inc(n){ return FV().increment(n); }
  function listingOf(id){ return (db.listings || []).find(function(l){ return l.id === id; }); }
  function nf(n){ try { return Number(n).toLocaleString('en-US'); } catch (e) { return String(n); } }
  function ini(n){ return esc(String(n || '?').split(' ').map(function(x){ return x[0]; }).slice(0, 2).join('').toUpperCase()); }
  function noop(){}

  /* =====================  CLOUD COUNTERS  ===================== */
  function fresh(){
    return { uid:null, stats:{}, seller:{}, plat:{ likes:0, hearts:0 }, pay:{}, offs:[], ready:{},
      mine:{ likes:{}, hearts:{}, views:{}, shares:{}, follows:{} } };
  }
  var S = fresh(), ens = {}, busy = {}, pt = null;

  function stat(id, f){ return ((S.stats[id] || {})[f]) || 0; }
  function seller(id){ return S.seller[id] || {}; }

  function dirty(){ clearTimeout(pt); pt = setTimeout(paint, 120); }

  function stopAll(){
    S.offs.forEach(function(f){ try { f(); } catch (e) {} });
    S = fresh(); ens = {}; busy = {};
  }

  function start(){
    if (!cloud() || S.uid === VXC.uid) return;
    stopAll();
    S.uid = VXC.uid;
    var d = D(), me0 = VXC.uid;
    function err(n){ return function(e){ console.warn('counters ' + n, e); }; }
    S.offs.push(d.collection('stats').onSnapshot(function(sn){
      sn.docChanges().forEach(function(c){ if (c.type === 'removed') delete S.stats[c.doc.id]; else S.stats[c.doc.id] = c.doc.data(); });
      dirty();
    }, err('stats')));
    S.offs.push(d.collection('sellerStats').onSnapshot(function(sn){
      sn.docChanges().forEach(function(c){ if (c.type === 'removed') delete S.seller[c.doc.id]; else S.seller[c.doc.id] = c.doc.data(); });
      dirty();
    }, err('sellerStats')));
    S.offs.push(d.doc('platform/totals').onSnapshot(function(s){ if (s.exists) S.plat = s.data(); dirty(); }, err('platform')));
    [['likes','listingId'], ['hearts','listingId'], ['views','listingId'], ['shares','listingId'], ['follows','sellerId']].forEach(function(p){
      S.offs.push(d.collection(p[0]).where('uid', '==', me0).onSnapshot(function(sn){
        var m = {}; sn.forEach(function(x){ var k = (x.data() || {})[p[1]]; if (k) m[k] = 1; });
        S.mine[p[0]] = m; S.ready[p[0]] = true; dirty();
      }, err(p[0])));
    });
    var pq = iAmAdmin() ? d.collection('payouts') : d.collection('payouts').where('uid', '==', me0);
    S.offs.push(pq.onSnapshot(function(sn){
      var m = {}; sn.forEach(function(x){ var v = x.data() || {}; v.id = x.id; m[x.id] = v; });
      S.pay = m; dirty();
    }, err('payouts')));
  }

  function ensureDoc(path, data, key){
    if (ens[key]) return ens[key];
    var ref = D().doc(path);
    ens[key] = ref.get().then(function(s){ if (!s.exists) return ref.set(data); }).catch(function(e){ delete ens[key]; throw e; });
    return ens[key];
  }
  var ZS = { likes:0, hearts:0, views:0, shares:0, comments:0, followers:0 };
  function ensureAll(lid, sid){
    return Promise.all([
      ensureDoc('stats/' + lid, { sellerId:sid, likes:0, hearts:0, views:0, shares:0, comments:0 }, 's' + lid),
      ensureDoc('sellerStats/' + sid, ZS, 't' + sid),
      ensureDoc('platform/totals', { likes:0, hearts:0 }, 'p')
    ]);
  }

  /* one person, one record per video: record + all counters go in ONE batch, and the rules check them together */
  function act(kind, lid){
    var l = listingOf(lid); if (!l || !cloud()) return Promise.reject(new Error('no listing'));
    var key = kind + lid; if (busy[key]) return Promise.resolve(); busy[key] = 1;
    var sid = l.sellerId, uid = VXC.uid, d = D();
    return ensureAll(lid, sid).then(function(){
      var b = d.batch(), o = {}, o2 = { ref:lid }, o3 = { ref:lid };
      b.set(d.collection(kind).doc(uid + '_' + lid), { uid:uid, listingId:lid, sellerId:sid, ts:Date.now() });
      o[kind] = inc(1); b.update(d.doc('stats/' + lid), o);
      o2[kind] = inc(1); b.update(d.doc('sellerStats/' + sid), o2);
      if (kind === 'likes' || kind === 'hearts') { o3[kind] = inc(1); b.update(d.doc('platform/totals'), o3); }
      return b.commit();
    }).then(function(){ busy[key] = 0; }, function(e){ busy[key] = 0; throw e; });
  }
  function undo(kind, lid){
    var l = listingOf(lid); if (!l || !cloud()) return Promise.reject(new Error('no listing'));
    var key = kind + lid; if (busy[key]) return Promise.resolve(); busy[key] = 1;
    var sid = l.sellerId, uid = VXC.uid, d = D();
    return ensureAll(lid, sid).then(function(){
      var b = d.batch(), o = {}, o2 = { ref:lid }, o3 = { ref:lid };
      b.delete(d.collection(kind).doc(uid + '_' + lid));
      o[kind] = inc(-1); b.update(d.doc('stats/' + lid), o);
      o2[kind] = inc(-1); b.update(d.doc('sellerStats/' + sid), o2);
      o3[kind] = inc(-1); b.update(d.doc('platform/totals'), o3);
      return b.commit();
    }).then(function(){ busy[key] = 0; }, function(e){ busy[key] = 0; throw e; });
  }
  function followAct(sid, on){
    var key = 'f' + sid; if (busy[key]) return Promise.resolve(); busy[key] = 1;
    var uid = VXC.uid, d = D();
    return ensureDoc('sellerStats/' + sid, ZS, 't' + sid).then(function(){
      var b = d.batch(), mref = d.collection('follows').doc(uid + '_' + sid);
      if (on) b.set(mref, { uid:uid, sellerId:sid, ts:Date.now() }); else b.delete(mref);
      b.update(d.doc('sellerStats/' + sid), { followers: inc(on ? 1 : -1) });
      return b.commit();
    }).then(function(){ busy[key] = 0; }, function(e){ busy[key] = 0; throw e; });
  }
  function postComment(lid, sid, u, text){
    var d = D(), uid = VXC.uid;
    return ensureAll(lid, sid).then(function(){
      var b = d.batch();
      b.set(d.collection('comments').doc(), { listingId:lid, sellerId:sid, uid:uid, name:u.name || 'Guest', text:text, ts:FV().serverTimestamp() });
      b.update(d.doc('stats/' + lid), { comments: inc(1) });
      b.update(d.doc('sellerStats/' + sid), { ref:lid, comments: inc(1) });
      b.set(d.doc('commentMeta/' + uid), { last:FV().serverTimestamp() });
      return b.commit();
    });
  }

  /* admin hearts = hearts given + likes (cloud) + videos posted */
  function adminTotal(){
    return (S.plat.likes || 0) + (S.plat.hearts || 0) + (db.listings || []).filter(function(l){ return l.video; }).length;
  }

  window.VXN = {
    on: function(){ return cloud(); },
    stat: stat,
    seller: seller,
    admin: adminTotal,
    mine: function(k, id){ return !!S.mine[k][id]; },
    heart: function(id){
      var u = me();
      return act('hearts', id).then(function(){
        if (u && !S.mine.likes[id]) return act('likes', id).catch(noop);
      });
    },
    view: function(id){
      var u = me(), l = listingOf(id);
      if (!cloud() || !u || !l || l.sellerId === u.id || S.mine.views[id]) return;
      act('views', id).catch(noop);
    },
    share: function(id){
      if (!cloud() || !me() || S.mine.shares[id]) return;
      act('shares', id).catch(noop);
    },
    payouts: function(){ return S.pay; }
  };

  /* ---------- make the existing like / follow code use the cloud numbers when online ---------- */
  function ov(name, fn){
    var prev = window[name];
    if (typeof prev !== 'function') return;
    window[name] = function(){ return cloud() ? fn.apply(this, arguments) : prev.apply(this, arguments); };
  }
  ov('_isLiked', function(id){ return !!S.mine.likes[id]; });
  ov('_likeCount', function(id){ return stat(id, 'likes'); });
  ov('_followerCount', function(id){ return seller(id).followers || 0; });
  ov('_isFollowing', function(id){ return !!S.mine.follows[id]; });
  ov('_sellerLikeTotal', function(id){ return seller(id).likes || 0; });
  ov('homeLike', function(id){
    var u = me();
    if (!u) { location.hash = '#/auth'; return; }
    if (!listingOf(id)) return;
    var p = S.mine.likes[id] ? undo('likes', id) : act('likes', id);
    p.catch(function(e){ console.warn('like', e); toast('Could not save your like. Check the Firestore rules.', 'err'); dirty(); });
  });
  ov('toggleFollow', function(id){
    var u = me();
    if (!u) { closeModal(); location.hash = '#/auth'; return; }
    if (u.id === id) return;
    var was = !!S.mine.follows[id];
    if (was && id === ADMIN && u.accountType === 'seller') { toast('Sellers follow the admin automatically and cannot unfollow.'); return; }
    followAct(id, !was).then(function(){ toast(was ? 'Unfollowed' : 'Following', was ? undefined : 'ok'); dirty(); })
      .catch(function(e){ console.warn('follow', e); toast('Could not follow. Check the Firestore rules.', 'err'); });
  });

  /* sellers follow the admin automatically (online) */
  setInterval(function(){
    try {
      var u = me();
      if (cloud() && u && u.accountType === 'seller' && u.id !== ADMIN && S.ready.follows && !S.mine.follows[ADMIN]) followAct(ADMIN, true).catch(noop);
    } catch (e) {}
  }, 4000);

  function paint(){
    try {
      document.querySelectorAll('.vs-btn[id^="like-"]').forEach(function(b){
        var id = b.id.slice(5), liked = !!S.mine.likes[id];
        b.classList.toggle('liked', liked);
        var c = b.querySelector('.vs-circle'); if (c && !c.querySelector('svg')) c.textContent = liked ? '❤️' : '🤍';
        var n = document.getElementById('like-n-' + id); if (n) n.textContent = stat(id, 'likes');
      });
      document.querySelectorAll('.vx-cm-btn').forEach(function(b){
        var n = b.querySelector('.vx-cmn'); if (n) n.textContent = cmCount(b.getAttribute('data-lid'));
      });
      var fb = document.getElementById('sp-follow');
      if (fb) {
        var m = /toggleFollow\('([^']+)'/.exec(fb.getAttribute('onclick') || '');
        if (m) {
          var f = !!S.mine.follows[m[1]];
          fb.className = 'btn ' + (f ? 'btn-ghost' : 'btn-primary'); fb.textContent = f ? '✓ Following' : '➕ Follow';
          var fn = document.getElementById('sp-followers'); if (fn) fn.textContent = seller(m[1]).followers || 0;
        }
      }
      if (typeof window.vxRefreshHearts === 'function') window.vxRefreshHearts();
    } catch (e) {}
  }
  setInterval(function(){ try { start(); } catch (e) { console.warn(e); } }, 2000);
  setInterval(function(){ if (!cloud() && S.uid) { stopAll(); } }, 3000);

  /* =====================  COMMENTS  ===================== */
  var cm = null, lastC = 0;

  function cmCount(lid){
    if (cloud()) return stat(lid, 'comments');
    return (db.vxComments || []).filter(function(c){ return c.listingId === lid; }).length;
  }
  function tms(c){ var t = c.ts; return t && t.toMillis ? t.toMillis() : (Number(t) || 0); }
  function ago(t){
    if (!t) return 'now';
    var s = Math.max(1, Math.round((Date.now() - t) / 1000));
    if (s < 60) return s + 's'; var m = Math.round(s / 60); if (m < 60) return m + 'm';
    var h = Math.round(m / 60); if (h < 24) return h + 'h'; return Math.round(h / 24) + 'd';
  }
  function closeCm(){
    if (!cm) return;
    try { cm.unsub && cm.unsub(); } catch (e) {}
    if (cm.el && cm.el.parentNode) cm.el.remove();
    cm = null;
  }
  window.vxCloseComments = closeCm;

  function renderCm(){
    if (!cm) return;
    var box = cm.el.querySelector('.ls'), u = me();
    var list = cm.list.slice().sort(function(a, b){ return tms(b) - tms(a); });
    cm.el.querySelector('.cnt').textContent = list.length ? '(' + nf(Math.max(list.length, cmCount(cm.lid))) + ')' : '';
    box.innerHTML = list.length ? list.map(function(c){
      var mineC = !!u && (c.uid === (cloud() ? VXC.uid : u.id) || iAmAdmin() || u.id === ADMIN);
      return '<div class="c"><div class="av">' + ini(c.name) + '</div><div style="min-width:0"><div class="nm">' + esc(c.name || 'Guest') + '</div>' +
        '<div class="tx">' + esc(c.text) + '</div><div class="tm">' + ago(tms(c)) + (mineC ? '<a data-del="' + esc(c.id) + '">Delete</a>' : '') + '</div></div></div>';
    }).join('') : '<div class="empty2">No comments yet. Be the first.</div>';
    box.querySelectorAll('a[data-del]').forEach(function(a){
      a.onclick = function(){ delComment(a.getAttribute('data-del')); };
    });
  }
  function delComment(id){
    if (!cm) return;
    if (cloud()) { D().collection('comments').doc(id).delete().catch(function(e){ console.warn(e); toast('Could not delete.', 'err'); }); return; }
    db.vxComments = (db.vxComments || []).filter(function(c){ return c.id !== id; });
    saveDB(); cm.list = cm.list.filter(function(c){ return c.id !== id; }); renderCm(); dirty();
  }

  window.vxComments = function(lid){
    closeCm();
    var el = document.createElement('div');
    el.id = 'vx-cm'; el.className = 'vx-cm';
    el.innerHTML = '<div class="bg"></div><div class="sh"><div class="hd"><b>💬 Comments <span class="cnt"></span></b><button type="button" aria-label="Close">✕</button></div>' +
      '<div class="ls"></div><div class="in"><input id="vx-cmi" maxlength="300" placeholder="Add a comment…" autocomplete="off"><button type="button">Post</button></div></div>';
    document.body.appendChild(el);
    cm = { lid:lid, el:el, list:[], unsub:null };
    el.querySelector('.bg').onclick = closeCm;
    el.querySelector('.hd button').onclick = closeCm;
    el.querySelector('.in button').onclick = window.vxSendComment;
    el.querySelector('#vx-cmi').onkeydown = function(e){ if (e.key === 'Enter') window.vxSendComment(); };
    if (cloud()) {
      cm.unsub = D().collection('comments').where('listingId', '==', lid).limit(200).onSnapshot(function(sn){
        if (!cm || cm.lid !== lid) return;
        cm.list = sn.docs.map(function(x){ var v = x.data() || {}; v.id = x.id; return v; });
        renderCm();
      }, function(e){ console.warn('comments', e); });
    } else {
      cm.list = (db.vxComments || []).filter(function(c){ return c.listingId === lid; });
      renderCm();
    }
  };

  window.vxSendComment = function(){
    var u = me();
    if (!u) { closeCm(); location.hash = '#/auth'; return; }
    var inp = document.getElementById('vx-cmi'); if (!inp || !cm) return;
    var v = inp.value.trim().slice(0, 300); if (!v) return;
    var lid = cm.lid, l = listingOf(lid); if (!l) return;
    if (Date.now() - lastC < 10000) return toast('Please wait a few seconds between comments.');
    lastC = Date.now(); inp.value = '';
    if (cloud()) {
      postComment(lid, l.sellerId, u, v).then(function(){ dirty(); }).catch(function(e){
        console.warn('comment', e); lastC = 0; inp.value = v;
        toast('Could not post the comment. Check the Firestore rules.', 'err');
      });
    } else {
      if (!db.vxComments) db.vxComments = [];
      var c = { id:uid('cm'), listingId:lid, uid:u.id, name:u.name, text:v, ts:Date.now() };
      db.vxComments.push(c); saveDB();
      cm.list = db.vxComments.filter(function(x){ return x.listingId === lid; });
      renderCm(); dirty();
    }
  };

  function addCmBtn(side){
    if (!side || side.querySelector('.vx-cm-btn')) return;
    var like = side.querySelector('.vs-btn[id^="like-"]'); if (!like) return;
    var lid = like.id.slice(5);
    var b = document.createElement('button');
    b.className = 'vs-btn vx-cm-btn'; b.setAttribute('data-lid', lid);
    b.setAttribute('onclick', "vxComments('" + lid + "')");
    b.innerHTML = '<span class="vs-circle">💬</span><span class="vx-cmn">' + cmCount(lid) + '</span>';
    like.insertAdjacentElement('afterend', b);
  }
  function scan(n){
    if (!n || n.nodeType !== 1) return;
    if (n.matches && n.matches('.video-side')) addCmBtn(n);
    if (n.querySelectorAll) n.querySelectorAll('.video-side').forEach(addCmBtn);
  }
  new MutationObserver(function(ms){ ms.forEach(function(m){ m.addedNodes.forEach(scan); }); }).observe(document.body, { childList:true, subtree:true });
  scan(document.body);
  window.addEventListener('hashchange', closeCm);

  /* =====================  PAYOUT REQUESTS  ===================== */
  window.vxPayout = function(){
    var u = me(); if (!u || !cloud()) return toast('Payout requests work on the online site.', 'err');
    var s = seller(VXC.uid), hearts = s.hearts || 0;
    if (!(s.views >= GOALS.views && s.followers >= GOALS.followers && s.likes >= GOALS.likes && s.comments >= GOALS.comments && s.shares >= GOALS.shares && hearts >= 10)) return toast('You have not reached all the goals yet.', 'err');
    if (Object.keys(S.pay).some(function(k){ return S.pay[k].status === 'pending'; })) return toast('You already have a payout request waiting.');
    D().collection('payouts').doc(VXC.uid + '_' + Date.now()).set({ uid:VXC.uid, name:u.name || '', hearts:hearts, status:'pending', ts:Date.now() })
      .then(function(){ toast('Payout requested. The admin will check it.', 'ok'); })
      .catch(function(e){ console.warn(e); toast('Could not send the request. Check the Firestore rules.', 'err'); });
  };
  window.vxPayPaid = function(id){
    if (!iAmAdmin()) return;
    D().collection('payouts').doc(id).update({ status:'paid', paidAt:Date.now() })
      .then(function(){ toast('Marked as paid', 'ok'); if ((location.hash || '') === '#/admin') window.renderAdminDash(); })
      .catch(function(e){ console.warn(e); toast('Could not update.', 'err'); });
  };

  var _rad = window.renderAdminDash;
  if (typeof _rad === 'function') window.renderAdminDash = function(){
    var r = _rad.apply(this, arguments);
    try {
      var app = document.getElementById('app'), box = app && app.firstElementChild;
      if (box && cloud() && iAmAdmin() && (location.hash || '') === '#/admin' && !document.getElementById('vx-pays')) {
        var list = Object.keys(S.pay).map(function(k){ return S.pay[k]; }).sort(function(a, b){ return (b.ts || 0) - (a.ts || 0); });
        var pend = list.filter(function(p){ return p.status === 'pending'; });
        var html = '<div id="vx-pays" style="margin:18px 0"><h2>Payout requests (' + pend.length + ')</h2>' +
          (pend.length ? pend.map(function(p){
            return '<div style="background:var(--surface);border:2px solid var(--gold);padding:14px 16px;margin:10px 0;border-radius:10px">' +
              '<b>' + esc(p.name || '') + '</b><div style="font-size:13px;color:var(--ink2)">' + nf(p.hearts || 0) + ' hearts ≈ $' + ((p.hearts || 0) / 10).toFixed(2) + ' (' + ((p.hearts || 0) * 0.0001).toFixed(4) + ' LNX)</div>' +
              '<button onclick="vxPayPaid(\'' + esc(p.id) + '\')" style="margin-top:10px;padding:10px 16px;background:var(--green);color:#fff;border-radius:6px;font-weight:bold">✅ Mark as paid</button></div>';
          }).join('') : '<p>No requests.</p>') + '</div>';
        var anchor = document.getElementById('vx-ahearts');
        if (anchor) anchor.insertAdjacentHTML('afterend', html); else box.insertAdjacentHTML('afterbegin', html);
      }
    } catch (e) { console.warn('payouts', e); }
    return r;
  };
})();
</script>

</body>
</html>
