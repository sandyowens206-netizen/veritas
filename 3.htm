        if(user.accountType==='seller'&&typeof showSellerStarPopup==='function')showSellerStarPopup(user.stars);
        location.hash='#/dashboard';
      }else{
        const side=user.accountType==='seller'?'seller':'buyer';
        if(!user.emailVerified){issueAndSendCode(user);location.hash='#/auth/'+side+'/code';}
        else location.hash='#/auth/'+side+'/kyc';
      }
    }catch(e){alert(authMsg(e));}
    finally{VXC.signingUp=false;}
  };

  const _prevLogout=window.logout;
  window.logout=function(){
    if(!VXC.on)return _prevLogout();
    const done=function(){
      db.session=null;
      scrubPrivateLocal();
      writeLocal();
      toast('Signed out');
      location.hash='#/';
    };
    Promise.resolve(VXC.auth.signOut()).then(done,done);
  };

  const _prevQuick=window.quickLogin;
  window.quickLogin=function(email){
    if(!VXC.on)return _prevQuick(email);
    toast('Demo accounts are switched off on the live site.','err');
  };

  const _prevKYC=window.submitAdvancedKYC;
  window.submitAdvancedKYC=async function(){
    if(!VXC.on)return _prevKYC();
    const billFile=document.getElementById('bill-upload').files[0];
    const selfieFile=document.getElementById('selfie-upload').files[0];
    const bankName=document.getElementById('bank-name').value.trim();
    const bankAcct=document.getElementById('bank-acct').value.trim();
    if(!billFile||!selfieFile||!bankName||!bankAcct)return alert("Please fill all fields and upload both files.");
    const btn=document.getElementById('kyc-btn');
    btn.innerText="Compressing & Sending...";
    const bill=await resizeImage(billFile,800,0.7);
    const selfie=await resizeImage(selfieFile,800,0.7);
    if(bill.length>650000||selfie.length>650000){
      btn.innerText='Submit For Review →';
      return alert("That file is too large. Please use a photo, or a PDF under 450 KB.");
    }
    const u=me();
    u.kycBillImage=bill;u.kycBillType=billFile.type;u.kycSelfieImage=selfie;
    u.bankName=bankName;u.bankAccount=bankAcct;
    u.kycStatus='pending_review';
    saveDB();
    sendAdminNotification(u,bill,selfie);
    location.hash='#/auth/pending';
  };

  /* Approving someone no longer signs YOU in as them */
  const _prevApprove=window.approveUser;
  window.approveUser=function(id){
    if(!VXC.on)return _prevApprove(id);
    const u=db.users.find(x=>x.id===id);
    if(!u)return;
    u.kycStatus='verified';
    saveDB();
    toast('Approved: '+u.name,'ok');
    renderAdminDash();
  };

  /* ---------- Start ---------- */
  function load(src){
    return new Promise(function(res,rej){
      const s=document.createElement('script');
      s.src=src;s.onload=res;s.onerror=function(){rej(new Error('Could not load '+src));};
      document.head.appendChild(s);
    });
  }

  (async function boot(){
    try{
      await load(SDK+'firebase-app-compat.js');
      await load(SDK+'firebase-auth-compat.js');
      await load(SDK+'firebase-firestore-compat.js');
      firebase.initializeApp(FB_CONFIG);
      VXC.auth=firebase.auth();
      VXC.fs=firebase.firestore();
    }catch(e){
      console.warn('Veritas cloud is not available, using this device only.',e);
      return;
    }
    VXC.on=true;
    document.body.classList.add('vx-cloud');
    if(!db.cloudClean){
      db.users=db.users.filter(u=>u.id==='owner');
      db.listings=[];db.inspections=[];db.reviews=[];db.saved=[];db.chats=[];
      db.cloudClean=true;
    }
    db.session=null;
    writeLocal();
    startPublic();
    VXC.auth.onAuthStateChanged(onAuth);
    rerender();
  })();
})();
</script>


<!-- ============================================================
  NEW ADDITION: SECURITY FIXES (added only, nothing above was edited or removed)

  1. ADMIN GATE
     - Admin Room and all approve / reject buttons now check that you are
       really the signed-in admin (not just a value saved on the phone).
     - The admin email must be verified. A verification link is sent
       automatically the first time the admin signs in.
     - The real lock is in firestore.rules (paste it in Firebase Console >
       Firestore Database > Rules). This block only fixes the screens.
  2. KYC DATA
     - Documents are no longer attached to the admin email.
     - Bank account number is masked in that email.
     - Documents are deleted after you approve or reject (switch below).
     - Documents are removed from the phone once they reached the cloud.
     - Other people's documents are never saved in the phone's storage.
  3. OFFLINE / DEMO MODE PASSWORDS
     - Passwords are salted + hashed (10,000 rounds). Plain text is never saved.
     - Old plain-text passwords are converted automatically on first open.
     - 5 wrong tries locks that email for 5 minutes.
     - Demo accounts and quick-login are switched off on https addresses.
============================================================ -->
<script>
(function(){
  'use strict';

  /* ---------- Switches you can change ---------- */
  var KYC_PURGE_AFTER_DECISION = true;   /* true = delete NEPA bill + selfie after approve/reject */
  var ROUNDS   = 10000;                  /* password hash rounds */
  var MAX_TRIES = 5;                     /* wrong passwords before lock */
  var LOCK_MS   = 5*60*1000;             /* lock time: 5 minutes */

  var isHttp = /^https?:$/.test(location.protocol);
  function cloudOn(){ return !!(window.VXC && VXC.on); }

  /* ---------- Who is really the admin ---------- */
  function adminOk(){
    if (isHttp) return cloudOn() && !!VXC.admin && !!db.session && db.session === 'owner';
    var u = me();
    return !!u && u.id === 'owner';
  }

  /* =========================================================
     3. PASSWORD HASHING (works on file:// pages too)
     ========================================================= */
  var K = [], H0 = [];
  (function(){
    var primes = [], n = 2, i;
    while (primes.length < 64) {
      var ok = true;
      for (i = 0; i < primes.length; i++) {
        if (primes[i] * primes[i] > n) break;
        if (n % primes[i] === 0) { ok = false; break; }
      }
      if (ok) primes.push(n);
      n++;
    }
    function frac(x){ return Math.floor((x - Math.floor(x)) * 4294967296) >>> 0; }
    for (i = 0; i < 64; i++) K[i] = frac(Math.cbrt(primes[i]));
    for (i = 0; i < 8; i++) H0[i] = frac(Math.sqrt(primes[i]));
  })();

  function ror(x, n){ return (x >>> n) | (x << (32 - n)); }

  function sha256(bytes){
    var l = bytes.length;
    var padLen = ((l + 9 + 63) >> 6) << 6;
    var m = new Uint8Array(padLen);
    m.set(bytes);
    m[l] = 0x80;
    var dv = new DataView(m.buffer);
    dv.setUint32(padLen - 8, Math.floor(l / 536870912));
    dv.setUint32(padLen - 4, (l << 3) >>> 0);
    var h = H0.slice(), w = new Array(64), i;
    for (var off = 0; off < padLen; off += 64) {
      for (i = 0; i < 16; i++) w[i] = dv.getUint32(off + i * 4);
      for (i = 16; i < 64; i++) {
        var s0 = ror(w[i-15], 7) ^ ror(w[i-15], 18) ^ (w[i-15] >>> 3);
        var s1 = ror(w[i-2], 17) ^ ror(w[i-2], 19) ^ (w[i-2] >>> 10);
        w[i] = (w[i-16] + s0 + w[i-7] + s1) | 0;
      }
      var a = h[0], b = h[1], c = h[2], d = h[3], e = h[4], f = h[5], g = h[6], hh = h[7];
      for (i = 0; i < 64; i++) {
        var S1 = ror(e, 6) ^ ror(e, 11) ^ ror(e, 25);
        var ch = (e & f) ^ (~e & g);
        var t1 = (hh + S1 + ch + K[i] + w[i]) | 0;
        var S0 = ror(a, 2) ^ ror(a, 13) ^ ror(a, 22);
        var mj = (a & b) ^ (a & c) ^ (b & c);
        var t2 = (S0 + mj) | 0;
        hh = g; g = f; f = e; e = (d + t1) | 0; d = c; c = b; b = a; a = (t1 + t2) | 0;
      }
      h[0] = (h[0] + a) | 0; h[1] = (h[1] + b) | 0; h[2] = (h[2] + c) | 0; h[3] = (h[3] + d) | 0;
      h[4] = (h[4] + e) | 0; h[5] = (h[5] + f) | 0; h[6] = (h[6] + g) | 0; h[7] = (h[7] + hh) | 0;
    }
    var out = new Uint8Array(32), ov = new DataView(out.buffer);
    for (i = 0; i < 8; i++) ov.setUint32(i * 4, h[i] >>> 0);
    return out;
  }

  function hex(u8){
    var s = '';
    for (var i = 0; i < u8.length; i++) s += (u8[i] < 16 ? '0' : '') + u8[i].toString(16);
    return s;
  }

  function hashPw(pw, salt){
    var enc = new TextEncoder();
    var pwb = enc.encode(pw);
    var h = sha256(enc.encode(salt + ':' + pw));
    for (var i = 0; i < ROUNDS; i++) {
      var m = new Uint8Array(h.length + pwb.length);
      m.set(h); m.set(pwb, h.length);
      h = sha256(m);
    }
    return hex(h);
  }

  function newSalt(){
    var a = new Uint8Array(12);
    try { crypto.getRandomValues(a); }
    catch (e) { for (var i = 0; i < 12; i++) a[i] = Math.floor(Math.random() * 256); }
    return hex(a);
  }

  function safeEq(a, b){
    if (typeof a !== 'string' || typeof b !== 'string' || a.length !== b.length) return false;
    var r = 0;
    for (var i = 0; i < a.length; i++) r |= a.charCodeAt(i) ^ b.charCodeAt(i);
    return r === 0;
  }

  window.vxSha256Hex = function(s){ return hex(sha256(new TextEncoder().encode(String(s)))); };

  /* Turn any saved plain-text password into a salted hash */
  function hashLegacy(){
    var changed = false;
    (db.users || []).forEach(function(u){
      if (typeof u.password === 'string' && u.password) {
        var salt = newSalt();
        u.passSalt = salt;
        u.passHash = hashPw(u.password, salt);
        u.passRounds = ROUNDS;
        delete u.password;
        changed = true;
      }
    });
    return changed;
  }

  /* Every save first converts passwords, so plain text never reaches storage */
  var _saveDB = window.saveDB;
  window.saveDB = function(){
    try { hashLegacy(); } catch (e) { console.warn('password hashing', e); }
    return _saveDB.apply(this, arguments);
  };

  /* Last line of defence at the storage door:
     - never store a plain-text password
     - in cloud mode, never store other people's KYC documents on this phone */
  try {
    var _setItem = Storage.prototype.setItem;
    Storage.prototype.setItem = function(k, v){
      if (k === DB_KEY && typeof v === 'string') {
        try {
          var o = JSON.parse(v);
          (o.users || []).forEach(function(u){
            delete u.password;
            if (cloudOn() && u.id !== o.session) {
              delete u.kycBillImage; delete u.kycSelfieImage; delete u.kycBillType;
            }
          });
          v = JSON.stringify(o);
        } catch (e) {}
      }
      return _setItem.call(this, k, v);
    };
  } catch (e) {}

  /* ---------- Offline login: checks the hash, locks after 5 wrong tries ---------- */
  var tries = {};
  var _prevLogin = window.loginUser;
  window.loginUser = async function(){
    if (cloudOn()) return _prevLogin.apply(this, arguments);
    var emailEl = document.getElementById('login-email');
    var passEl  = document.getElementById('login-pass');
    if (!emailEl || !passEl) return _prevLogin.apply(this, arguments);
    var email = emailEl.value.trim().toLowerCase();
    var pass  = passEl.value;
    if (!email || !pass) return alert('Please enter email and password');

    /* the admin email keeps its own code-by-email flow */
    if (email === vxAdminMail().toLowerCase()) return _prevLogin.apply(this, arguments);

    var t = tries[email] || { n: 0, until: 0 };
    if (Date.now() < t.until) return alert('Too many wrong attempts. Try again in a few minutes.');

    var user = db.users.find(function(u){ return u.email && u.email.toLowerCase() === email; });
    if (user && isHttp && ['u1','u2','u3','u4'].indexOf(user.id) > -1) {
      return alert('Demo accounts are switched off on the live site.');
    }

    var ok = false;
    if (user && user.passHash && user.passSalt) ok = safeEq(hashPw(pass, user.passSalt), user.passHash);
    if (!ok) {
      t.n++;
      if (t.n >= MAX_TRIES) { t.until = Date.now() + LOCK_MS; t.n = 0; }
      tries[email] = t;
      return alert('Invalid email or password.');
    }
    tries[email] = { n: 0, until: 0 };

    db.session = user.id; saveDB();
    toast('Welcome back, ' + user.name.split(' ')[0], 'ok');
    if (user.kycStatus === 'pending_review') {
      location.hash = '#/auth/pending';
    } else if (user.kycStatus === 'verified') {
      if (user.accountType === 'seller') showSellerStarPopup(user.stars);
      location.hash = '#/dashboard';
    } else {
      var side = user.accountType === 'seller' ? 'seller' : 'buyer';
      if (!user.emailVerified && !user.verified) { issueAndSendCode(user); location.hash = '#/auth/' + side + '/code'; }
      else location.hash = '#/auth/' + side + '/kyc';
    }
  };

  /* Quick-login (no password at all) only works on a file / demo, never on a web address */
  var _prevQuick = window.quickLogin;
  window.quickLogin = function(email){
    if (isHttp) { toast('Demo accounts are switched off on the live site.', 'err'); return; }
    return _prevQuick.apply(this, arguments);
  };

  /* =========================================================
     1. ADMIN GATE
     ========================================================= */
  var waiting = false;
  function waitForAdmin(n){
    if ((location.hash || '') !== '#/admin') { waiting = false; return; }
    if (adminOk()) { waiting = false; router(); return; }
    if (n >= 20) { waiting = false; toast('Not allowed', 'err'); location.hash = '#/'; return; }
    setTimeout(function(){ waitForAdmin(n + 1); }, 400);
  }

  var _renderAdminDash = window.renderAdminDash;
  window.renderAdminDash = function(){
    if (adminOk()) return _renderAdminDash.apply(this, arguments);
    if (isHttp) {
      var app = document.getElementById('app');
      if (app) app.innerHTML = '<div class="empty" style="padding:60px 20px"><div class="big">🔐</div><h3>Checking admin access…</h3></div>';
      if (!waiting) { waiting = true; waitForAdmin(0); }
      return;
    }
    toast('Not allowed', 'err');
    location.hash = '#/';
  };

  function guard(name, after){
    var f = window[name];
    if (typeof f !== 'function') return;
    window[name] = function(id){
      if (!adminOk()) { toast('Not allowed', 'err'); return; }
      var r = f.apply(this, arguments);
      if (after) { try { after(id); } catch (e) { console.warn(e); } }
      return r;
    };
  }

  /* =========================================================
     2. KYC DATA
     ========================================================= */
  function purgeKyc(id){
    if (!KYC_PURGE_AFTER_DECISION) return;
    var u = db.users.find(function(x){ return x.id === id; });
    if (u) { delete u.kycBillImage; delete u.kycSelfieImage; delete u.kycBillType; }
    if (cloudOn() && VXC.admin) {
      VXC.fs.collection('kyc').doc(id).delete().catch(function(e){ console.warn('kyc purge', e); });
    }
    try { saveDB(); } catch (e) {}
  }

  guard('approveUser', purgeKyc);
  guard('rejectUser', purgeKyc);
  guard('approvePayment');
  guard('rejectPayment');

  /* Admin email: no documents attached, account number masked */
  window.sendAdminNotification = async function(user){
    var c = db.emailConfig;
    try {
      emailjs.init({ publicKey: c.publicKey });
      var acct = String(user.bankAccount || '');
      await emailjs.send(c.serviceId, c.templateId, {
        to_email: vxAdminMail(),
        name: 'KYC REVIEW NEEDED: ' + user.name,
        email: user.email,
        bank_details: (user.bankName || '') + ' | ****' + acct.slice(-4),
        bill_image: '',
        selfie_image: '',
        code: '-',
        app_name: 'Veritas',
        note: 'Documents are not attached. Open the Admin Room to review them.'
      });
    } catch (e) { console.log('EmailJS Error: ', e); }
  };

  /* After the documents reached the cloud, remove them from this phone */
  function scrubWhenUploaded(id, n){
    if (n > 40 || !cloudOn()) return;
    var again = function(){ setTimeout(function(){ scrubWhenUploaded(id, n + 1); }, 3000); };
    VXC.fs.collection('kyc').doc(id).get({ source: 'server' }).then(function(s){
      if (s.exists) {
        var u = db.users.find(function(x){ return x.id === id; });
        if (u) { delete u.kycBillImage; delete u.kycSelfieImage; delete u.kycBillType; saveDB(); }
      } else again();
    }).catch(again);
  }
  var _prevKYC = window.submitAdvancedKYC;
  window.submitAdvancedKYC = async function(){
    var r = await _prevKYC.apply(this, arguments);
    try {
      if (cloudOn()) { var u = me(); if (u && u.id !== 'owner') scrubWhenUploaded(u.id, 0); }
    } catch (e) {}
    return r;
  };

  /* ---------- Admin email must be verified (the rules check it too) ---------- */
  function whenAuthReady(cb, n){
    n = n || 0;
    if (window.VXC && VXC.auth) { cb(); return; }
    if (n > 60) return;
    setTimeout(function(){ whenAuthReady(cb, n + 1); }, 500);
  }
  whenAuthReady(function(){
    VXC.auth.onAuthStateChanged(function(fb){
      if (!fb) return;
      if (String(fb.email || '').toLowerCase() !== vxAdminMail().toLowerCase()) return;
      if (fb.emailVerified) return;
      try {
        if (sessionStorage.getItem('vx_adm_ver')) return;
        sessionStorage.setItem('vx_adm_ver', '1');
      } catch (e) {}
      fb.sendEmailVerification().then(function(){
        toast('Admin email is not verified. A link was sent to ' + fb.email + '. Open it, then sign in again.', 'err');
      }).catch(function(){});
    });
  });

  /* ---------- Convert any old plain-text passwords right now ---------- */
  try { if (hashLegacy()) saveDB(); } catch (e) { console.warn('password hashing', e); }
})();
</script>


<!-- ============================================================
  NEW ADDITION: ADMIN ROOM - ALL REGISTERED USERS (added only, nothing above was edited or removed)
  Shows every person who signed up (buyers and sellers), whether they
  are approved, waiting, rejected or not finished yet. Has a search box
  and filter buttons. Appears at the bottom of the Admin Room.
============================================================ -->
<script>
(function(){
  'use strict';
  var FILTER = 'all';

  function allUsers(){
    var cloud = !!(window.VXC && VXC.on);
    return (db.users || []).filter(function(u){
      if (!u || u.id === 'owner') return false;
      if (cloud && ['u1','u2','u3','u4'].indexOf(u.id) > -1) return false; /* demo accounts */
      return true;
    }).sort(function(a, b){
      return String(b.createdAt || '').localeCompare(String(a.createdAt || ''));
    });
  }

  function statusOf(u){
    if (u.isStub) return { key:'profile', label:'Profile only', cls:'grey' };
    if (u.kycStatus === 'verified' || u.verified === true) return { key:'verified', label:'✅ Approved', cls:'' };
    if (u.kycStatus === 'pending_review') return { key:'pending', label:'⏳ Waiting approval', cls:'gold' };
    if (u.kycStatus === 'rejected') return { key:'rejected', label:'❌ Rejected', cls:'grey' };
    return { key:'unfinished', label:'Not finished KYC', cls:'grey' };
  }

  function row(u){
    var st = statusOf(u);
    var type = String(u.accountType || '').toUpperCase();
    var extra = [];
    if (u.phone) extra.push('📞 ' + esc(u.phone));
    if (u.accountType === 'seller') extra.push('⭐ ' + (u.stars || 0) + ' stars');
    if (u.createdAt) extra.push('Joined ' + esc(String(u.createdAt).slice(0, 10)));
    var hay = [u.name, u.email, u.phone, u.accountType, st.label].join(' ').toLowerCase();
    return '<div class="vx-urow" data-s="' + st.key + '" data-h="' + esc(hay) + '" ' +
      'style="background:var(--surface);border:1px solid var(--line);padding:14px 16px;margin-bottom:10px;border-radius:10px;">' +
        '<div style="display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;align-items:center;">' +
          '<b>' + esc(u.name || '(no name)') + '</b>' +
          '<span><span class="badge ' + (u.accountType === 'seller' ? 'gold' : 'grey') + '">' + esc(type) + '</span> ' +
          '<span class="badge ' + st.cls + '">' + st.label + '</span></span>' +
        '</div>' +
        '<div style="margin-top:6px;font-size:13px;color:var(--ink2);word-break:break-all;">' + esc(u.email || '—') + '</div>' +
        '<div style="margin-top:4px;font-size:12px;color:var(--ink2);">' + extra.join(' &nbsp;·&nbsp; ') + '</div>' +
      '</div>';
  }

  function counts(list){
    var c = { all:list.length, verified:0, pending:0, rejected:0, unfinished:0 };
    list.forEach(function(u){ var k = statusOf(u).key; if (c[k] !== undefined) c[k]++; });
    return c;
  }

  function applyFilter(){
    var q = ((document.getElementById('vx-usearch') || {}).value || '').trim().toLowerCase();
    var shown = 0;
    document.querySelectorAll('.vx-urow').forEach(function(el){
      var okS = FILTER === 'all' || el.getAttribute('data-s') === FILTER;
      var okQ = !q || el.getAttribute('data-h').indexOf(q) > -1;
      el.style.display = (okS && okQ) ? '' : 'none';
      if (okS && okQ) shown++;
    });
    var n = document.getElementById('vx-unone');
    if (n) n.style.display = shown ? 'none' : '';
    document.querySelectorAll('.vx-ufbtn').forEach(function(b){
      var on = b.getAttribute('data-f') === FILTER;
      b.style.background = on ? 'var(--green)' : 'var(--surface)';
      b.style.color = on ? '#fff' : 'var(--ink)';
    });
  }

  window.vxUserFilter = function(f){ FILTER = f; applyFilter(); };
  window.vxUserSearch = function(){ applyFilter(); };

  function section(){
    var list = allUsers(), c = counts(list);
    function btn(f, label, n){
      return '<button class="vx-ufbtn" data-f="' + f + '" onclick="vxUserFilter(\'' + f + '\')" ' +
        'style="padding:8px 12px;border:1px solid var(--line);border-radius:99px;font-weight:600;font-size:12px;">' + label + ' (' + n + ')</button>';
    }
    return '<div id="vx-allusers">' +
      '<hr style="margin:40px 0;border-color:var(--line);">' +
      '<h2>All Registered Users (' + c.all + ')</h2>' +
      '<input id="vx-usearch" type="search" placeholder="Search name, email or phone" oninput="vxUserSearch()" ' +
        'style="width:100%;padding:12px;border:1px solid var(--line);border-radius:10px;margin:12px 0;font-size:15px;">' +
      '<div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px;">' +
        btn('all', 'All', c.all) + btn('verified', 'Approved', c.verified) + btn('pending', 'Waiting', c.pending) +
        btn('rejected', 'Rejected', c.rejected) + btn('unfinished', 'Not finished', c.unfinished) +
      '</div>' +
      list.map(row).join('') +
      '<p id="vx-unone" style="display:none;">No users match.</p>' +
      (list.length === 0 ? '<p>No one has signed up yet.</p>' : '') +
    '</div>';
  }

  var _prev = window.renderAdminDash;
  window.renderAdminDash = function(){
    var r = _prev.apply(this, arguments);
    try {
      var app = document.getElementById('app');
      var box = app && app.firstElementChild;
      if (box && (location.hash || '') === '#/admin' && !document.getElementById('vx-allusers')) {
        var keep = (document.getElementById('vx-usearch') || {}).value;
        box.insertAdjacentHTML('beforeend', section());
        applyFilter();
      }
    } catch (e) { console.warn('all users list', e); }
    return r;
  };
})();
</script>

<script>
(function(){
  'use strict';

  function sellerOf(el){
    var m = /openSellerProfile\('([^']*)'\)/.exec(el.getAttribute('onclick') || '');
    if (!m) return '';
    return m[1].replace(/&#39;/g, "'").replace(/&amp;/g, '&');
  }

  function paint(badge, id){
    var on = false;
    try { on = _isFollowing(id); } catch (e) {}
    var txt = on ? '✓' : '+';
    if (badge.textContent !== txt) badge.textContent = txt;
    badge.classList.toggle('on', on);
    var mine = false;
    try { var u = me(); mine = !!u && u.id === id; } catch (e) {}
    badge.style.display = mine ? 'none' : '';
  }

  function enhance(){
    document.querySelectorAll('.vs-profile').forEach(function(av){
      var id = sellerOf(av);
      if (!id) return;
      var b = av.querySelector('.vx-plus');
      if (!b) {
        b = document.createElement('span');
        b.className = 'vx-plus';
        b.setAttribute('role', 'button');
        b.setAttribute('aria-label', 'Follow');
        b.addEventListener('click', function(ev){
          ev.stopPropagation();
          ev.preventDefault();
          toggleFollow(id);
        });
        av.appendChild(b);
      }
      paint(b, id);
    });
  }

  /* keep every "+" in step after any follow / unfollow (also from the profile page) */
  var _prevToggle = window.toggleFollow;
  window.toggleFollow = function(id){
    var r = _prevToggle.apply(this, arguments);
    try { enhance(); } catch (e) {}
    return r;
  };

  /* add the "+" whenever the home feed is drawn */
  var t = null;
  function soon(){ clearTimeout(t); t = setTimeout(function(){ try { enhance(); } catch (e) {} }, 60); }
  function start(){
    var app = document.getElementById('app');
    if (app && window.MutationObserver) new MutationObserver(soon).observe(app, { childList: true, subtree: true });
    soon();
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', start); else start();
})();
</script>


<!-- ============================================================
  NEW ADDITION: Chat page with 3 tabs - Person / Group / LGA (or City)
  (Added only. Nothing above was edited or removed. The old chat list and
  room code are still in the file; these later definitions take priority.)

  - 👤 Person : your personal chats (started from a seller's profile).
  - 👥 Group  : "Veritas Community" (everyone), plus groups you create or join.
  - 📍 LGA    : in Nigeria. In any other country this tab is called "City / Town".
                Type your LGA / city once to join its group, or tap the quick
                button if it is already in your profile.
  NOTE: chats are still saved per phone for now (same as before), so people on
  different phones will not see each other's messages until chats are put in
  the cloud (the next step).
============================================================ -->
<style>
.vx-ctabs{display:flex;gap:6px;margin:18px 0 6px;overflow-x:auto}
.vx-ctab{flex:1;min-width:96px;padding:11px 10px;border:1px solid var(--line);border-radius:99px;background:var(--surface);
  font-weight:700;font-size:13px;color:var(--ink2);white-space:nowrap;text-align:center}
.vx-ctab.on{background:var(--green);color:#fff;border-color:var(--green)}
.vx-cbox{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;margin:14px 0}
.vx-cbox input{width:100%;padding:11px;border:1px solid var(--line);border-radius:10px;font-size:15px;margin:8px 0}
</style>
<script>
(function(){
  'use strict';
  var TAB = 'person';

  function isNG(){ return !window.VX || VX.country === 'NG'; }
  function areaWord(){ return isNG() ? 'LGA' : 'City / Town'; }
  function areaExample(){ return isNG() ? 'e.g. Eti-Osa, Ikeja' : 'e.g. Manchester'; }
  function kindOf(c){
    if (c.type === 'dm') return 'person';
    if (c.type === 'group' || c.type === 'team') return 'group';
    return 'area';
  }
  function mine(u){ return (db.chats || []).filter(function(c){ return c.members && c.members.indexOf(u.id) > -1; }); }

  /* the general group everyone belongs to */
  function ensureCommunity(u){
    var changed = false;
    var g = db.chats.find(function(c){ return c.id === 'community'; });
    if (!g) {
      g = { id:'community', type:'group', name:'Veritas Community', open:true, members:[], messages:[] };
      db.chats.push(g); changed = true;
    }
    if (g.members.indexOf(u.id) < 0) { g.members.push(u.id); changed = true; }
    if (changed) saveDB();
  }

  function row(c, u){
    var last = c.messages && c.messages[c.messages.length - 1];
    var badge = c.type === 'dm' ? 'Personal' : (c.members.length + ' members');
    return '<div class="listing-card ' + (c.type === 'dm' ? 'chat-list-dm' : '') + '" onclick="location.hash=\'#/chats/' + c.id + '\'" ' +
      'style="padding:18px;display:flex;flex-direction:column;gap:8px;margin-bottom:12px;">' +
        '<div style="display:flex;justify-content:space-between;align-items:center;gap:8px;">' +
          '<h3 style="font-size:17px;color:var(--green);">' + _chatTitle(c, u) + '</h3>' +
          '<span class="badge grey">' + badge + '</span>' +
        '</div>' +
        '<p style="font-size:14px;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">' +
          (last ? '<b>' + esc(last.senderName) + ':</b> ' + esc(last.text) : 'No messages yet. Say hello 👋') +
        '</p></div>';
  }

  function tabsHtml(n){
    function t(k, label, cnt){
      return '<button class="vx-ctab ' + (TAB === k ? 'on' : '') + '" onclick="vxChatTab(\'' + k + '\')">' + label + ' (' + cnt + ')</button>';
    }
    return '<div class="vx-ctabs">' + t('person', '👤 Person', n.person) + t('group', '👥 Group', n.group) +
      t('area', '📍 ' + areaWord(), n.area) + '</div>';
  }

  function personTab(list){
    if (!list.length) return '<div class="empty"><div class="big">💬</div><h3>No personal chats yet</h3>' +
      '<p style="margin-top:10px;">Tap a seller\'s profile picture on the Home page, then tap Chat.</p></div>';
    return list.map(function(c){ return row(c, me()); }).join('');
  }

  function groupTab(list, u){
    var open = db.chats.filter(function(c){ return c.type === 'group' && c.open && c.members.indexOf(u.id) < 0; });
    var h = list.length ? list.map(function(c){ return row(c, u); }).join('') : '<p>You are not in any group yet.</p>';
    if (open.length) {
      h += '<h3 style="margin-top:22px;">Open groups you can join</h3>' + open.map(function(c){
        return '<div class="vx-cbox" style="display:flex;justify-content:space-between;align-items:center;gap:8px;">' +
          '<span><b>' + esc(c.name) + '</b><br><span style="font-size:12px;color:var(--ink3);">' + c.members.length + ' members</span></span>' +
          '<button class="btn btn-primary btn-sm" onclick="vxJoinGroup(\'' + c.id + '\')">Join</button></div>';
      }).join('');
    }
    h += '<div class="vx-cbox"><b>➕ Create a group</b>' +
      '<input id="vx-gname" maxlength="40" placeholder="Group name">' +
      '<button class="btn btn-primary" onclick="vxCreateGroup()">Create group</button></div>';
    return h;
  }

  function areaTab(list, u){
    var own = isNG() ? u.lga : u.city;
    var quick = '';
    if (own) {
      var already = list.some(function(c){ return String(c.lga || '').toLowerCase() === String(own).toLowerCase(); });
      if (!already) quick = '<button class="btn btn-primary" data-n="' + esc(own) + '" onclick="vxJoinArea(this.getAttribute(\'data-n\'))" style="margin-bottom:10px;">📍 Join ' + esc(own) + ' (from your profile)</button>';
    }
    var h = list.length ? list.map(function(c){ return row(c, u); }).join('') : '<p>You have not joined any ' + (isNG() ? 'LGA' : 'city / town') + ' group yet.</p>';
    h += '<div class="vx-cbox"><b>📍 Join your ' + areaWord() + ' group</b>' + quick +
      '<input id="vx-area-in" maxlength="60" placeholder="' + areaExample() + '" onkeydown="if(event.key===\'Enter\')vxJoinArea()">' +
      '<button class="btn btn-primary" onclick="vxJoinArea()">Join group</button></div>';
    return h;
  }

  window.renderChatList = function(){
    var u = me();
    if (!u) return;
    ensureCommunity(u);
    var all = mine(u);
    var by = { person:[], group:[], area:[] };
    all.forEach(function(c){ by[kindOf(c)].push(c); });
    var n = { person:by.person.length, group:by.group.length, area:by.area.length };
    var body = TAB === 'group' ? groupTab(by.group, u) : TAB === 'area' ? areaTab(by.area, u) : personTab(by.person);
    $('#app').innerHTML =
      '<div class="section-head"><div><h1 style="font-size:26px;letter-spacing:-.02em">Chats</h1>' +
      '<p style="color:var(--ink3);font-size:14px;margin-top:4px">Personal messages, groups and your ' + (isNG() ? 'LGA' : 'city / town') + ' community.</p></div></div>' +
      tabsHtml(n) + '<div>' + body + '</div>';
  };

  window.vxChatTab = function(k){ TAB = k; window.renderChatList(); };

  window.vxJoinGroup = function(id){
    var u = me(); if (!u) return;
    var c = db.chats.find(function(x){ return x.id === id && x.type === 'group' && x.open; });
    if (!c) return;
    if (c.members.indexOf(u.id) < 0) c.members.push(u.id);
    saveDB(); toast('Joined ' + c.name, 'ok');
    location.hash = '#/chats/' + c.id;
  };

  window.vxCreateGroup = function(){
    var u = me(); if (!u) return;
    var el = document.getElementById('vx-gname');
    var name = String((el && el.value) || '').trim().replace(/\s+/g, ' ');
    if (!name) return toast('Type a group name', 'err');
    var c = { id: uid('g'), type:'group', name:name, open:true, createdBy:u.id, members:[u.id], messages:[] };
    db.chats.push(c); saveDB();
    toast('Group created', 'ok');
    location.hash = '#/chats/' + c.id;
  };

  window.vxJoinArea = function(nameArg){
    var u = me(); if (!u) return;
    var el = document.getElementById('vx-area-in');
    var name = String(nameArg || (el && el.value) || '').trim().replace(/\s+/g, ' ');
    if (!name) return toast('Type your ' + areaWord(), 'err');
    var key = name.toLowerCase(), cc = window.VX ? VX.country : 'NG';
    var chat = db.chats.find(function(c){
      return !c.type && String(c.lga || '').toLowerCase() === key && (!c.country || c.country === cc);
    });
    if (!chat) { chat = { id: uid('c'), lga: name, country: cc, members: [], messages: [] }; db.chats.push(chat); }
    if (chat.members.indexOf(u.id) < 0) chat.members.push(u.id);
    saveDB(); toast('Joined ' + chat.lga, 'ok');
    location.hash = '#/chats/' + chat.id;
  };

  /* group name in the chat room title */
  var _title = window._chatTitle;
  window._chatTitle = function(c, u){
    if (c && c.type === 'group') return '👥 ' + esc(c.name || 'Group');
    return _title.apply(this, arguments);
  };

  /* chat room: right wording under the title, and remember the tab for the Back button */
  var _room = window.renderChatRoom;
  window.renderChatRoom = function(id){
    var r = _room.apply(this, arguments);
    try {
      var chat = db.chats.find(function(c){ return c.id === id; });
      var p = document.querySelector('.chat-header p');
      if (chat) {
        TAB = kindOf(chat);
        if (p && chat.type === 'group') p.textContent = chat.members.length + ' members · Group chat';
        else if (p && !chat.type) p.textContent = chat.members.length + ' members in this ' + ((chat.country || 'NG') === 'NG' ? 'LGA' : 'city / town');
      }
    } catch (e) {}
    return r;
  };

})();
</script>


<!-- ============================================================
  NEW ADDITION: Location required + 60% local posts + auto language + "Translate" on posts
  (Added only. Nothing above was edited or removed.)

  1. LOCATION: when someone opens the site, the phone is asked to turn on
     location. The country is found from it. Without location the site shows
     a "Turn on location" screen (only on a real https address).
     Switch it off any time: set LOCATION_REQUIRED = false below.
  2. 60% LOCAL: on Home and Explore, posts are mixed 3 from the person's
     own country, then 2 from other countries, repeating. If there are
     not enough of one kind, the rest fill in.
  3. LANGUAGE: first visit uses the browser / phone language if the app has
     it (English, French, Spanish, Portuguese, Arabic). Anything the person
     picked in Settings is never overwritten.
  4. POSTS: what sellers write (title and description) is NOT translated
     automatically. If a post is in a different language from the viewer's,
     a "🌐 Translate" button appears (Home video + post page).
     New posts remember the language they were written in.
============================================================ -->
<style>
#vx-geo{position:fixed;inset:0;z-index:99999;background:rgba(8,20,14,.96);color:#fff;display:flex;align-items:center;justify-content:center;padding:24px;text-align:center}
#vx-geo .box{max-width:360px}
#vx-geo h2{font-size:24px;margin:10px 0}
#vx-geo p{opacity:.85;line-height:1.55;font-size:15px;margin:8px 0}
#vx-geo button{margin-top:16px;padding:14px 22px;border-radius:99px;background:#0e7a4f;color:#fff;font-weight:700;font-size:15px;border:none;width:100%}
.vx-trbtn{display:inline-flex;align-items:center;gap:6px;margin:8px 0;padding:7px 13px;border-radius:99px;border:1px solid var(--line);
  background:var(--surface);color:var(--ink);font-size:12px;font-weight:700;cursor:pointer}
.video-info .vx-trbtn{background:rgba(0,0,0,.45);color:#fff;border-color:rgba(255,255,255,.35)}
</style>
<script>
(function(){
  'use strict';

  /* ---------- Switches you can change ---------- */
  var LOCATION_REQUIRED = true;   /* false = ask nicely but never block the site */
  var PATTERN = ['L','L','L','O','O']; /* 3 local, 2 other = 60% local */

  var isHttp = /^https?:$/.test(location.protocol);
  var CODES = 'NG GH KE ZA EG MA TZ UG RW ET SN CI CM DZ TN AO ZM ZW BW NA US CA MX BR AR CL CO PE GB IE FR DE ES PT IT NL BE CH SE NO DK FI PL CZ HU RO GR TR UA RU AE SA QA KW IL IN PK BD LK CN JP KR SG MY ID PH TH VN HK AU NZ'.split(' ');
  var UI_LANGS = ['en','fr','es','pt','ar'];

  function lsGet(k){ try { return localStorage.getItem(k); } catch (e) { return null; } }
  function lsSet(k, v){ try { localStorage.setItem(k, v); } catch (e) {} }
  function curLang(){ return (window.VX && VX.lang) || 'en'; }

  /* =====================  1. LOCATION  ===================== */
  var geoCC = null;
  window.vxGeoCountry = function(){ return geoCC || lsGet('vx_geo_cc') || (window.VX && VX.country) || 'NG'; };

  function regionFromLocale(){
    try {
      var l = (navigator.languages && navigator.languages[0]) || navigator.language || '';
      var m = /[-_]([A-Za-z]{2})\b/.exec(l);
      return m ? m[1].toUpperCase() : null;
    } catch (e) { return null; }
  }

  function reverse(lat, lon){
    return fetch('https://api.bigdatacloud.net/data/reverse-geocode-client?latitude=' + lat + '&longitude=' + lon + '&localityLanguage=en')
      .then(function(r){ return r.json(); })
      .then(function(j){ return String(j.countryCode || '').toUpperCase() || null; });
  }

  function ask(){
    return new Promise(function(res){
      if (!navigator.geolocation) return res({ ok:false, why:'unsupported' });
      navigator.geolocation.getCurrentPosition(
        function(p){ res({ ok:true, lat:p.coords.latitude, lon:p.coords.longitude }); },
        function(e){ res({ ok:false, why: e && e.code === 1 ? 'denied' : 'error' }); },
        { enableHighAccuracy:false, timeout:15000, maximumAge:3600000 }
      );
    });
  }

  function hideGate(){ var g = document.getElementById('vx-geo'); if (g) g.remove(); }
  function showGate(why){
    if (!LOCATION_REQUIRED) return;
    var msg = why === 'denied'
      ? 'Location is blocked. Tap the lock icon next to the website address, open Site settings, set <b>Location</b> to <b>Allow</b>, then tap the button below.'
      : why === 'unsupported'
        ? 'This browser cannot share location. Please open the site in Chrome or Safari.'
        : 'We could not get your location. Switch on GPS / location on your phone and try again.';
    var g = document.getElementById('vx-geo');
    if (!g) { g = document.createElement('div'); g.id = 'vx-geo'; document.body.appendChild(g); }
    g.innerHTML = '<div class="box"><div style="font-size:54px">📍</div><h2>Turn on your location</h2>' +
      '<p>Veritas shows you properties from your own country first, so we need to know where you are.</p><p>' + msg + '</p>' +
      '<button onclick="vxGeoRetry()">Turn on location</button></div>';
  }

  function applyFirstVisit(cc){
    /* only when the person has never chosen anything in Settings */
    try {
      if (cc && CODES.indexOf(cc) > -1 && !lsGet('veritas_country') && window.VX && VX.country !== cc && typeof vxPick === 'function') {
        vxPick('country', cc); if (typeof closeModal === 'function') closeModal();
      }
    } catch (e) {}
    try {
      var bl = String((navigator.languages && navigator.languages[0]) || navigator.language || 'en').slice(0, 2).toLowerCase();
      if (!lsGet('veritas_lang') && UI_LANGS.indexOf(bl) > -1 && bl !== curLang() && typeof vxPick === 'function') {
        vxPick('lang', bl); if (typeof closeModal === 'function') closeModal();
      }
    } catch (e) {}
  }

  function start(){
    /* the language is set even before location answers */
    applyFirstVisit(null);
    if (!isHttp) { geoCC = regionFromLocale(); return; }   /* local file: no location available, never block */
    ask().then(function(r){
      if (!r.ok) {
        var cached = lsGet('vx_geo_cc');
        if (r.why === 'error' && cached) { geoCC = cached; hideGate(); mixAll(); return; }
        showGate(r.why); return;
      }
      return reverse(r.lat, r.lon).catch(function(){ return null; }).then(function(cc){
        cc = cc || lsGet('vx_geo_cc') || regionFromLocale() || (window.VX && VX.country) || 'NG';
        geoCC = cc; lsSet('vx_geo_cc', cc);
        hideGate();
        applyFirstVisit(cc);
        mixAll();
      });
    });
  }
  window.vxGeoRetry = function(){ start(); };

  /* =====================  2. 60% LOCAL  ===================== */
  function idOf(el){
    var m = /#\/listing\/([^'"\s]+)/.exec(el.getAttribute('onclick') || '');
    return m ? m[1] : null;
  }
  function countryOf(id){
    var l = (db.listings || []).find(function(x){ return x.id === id; });
    return String((l && l.country) || 'NG').toUpperCase();
  }

  function mixContainer(box, sel){
    var kids = Array.prototype.slice.call(box.children);
    var cards = kids.filter(function(k){ return k.matches(sel) && idOf(k); });
    if (cards.length < 2 || cards.length !== kids.length) return;
    var home = vxGeoCountry(), L = [], O = [];
    cards.forEach(function(c){ (countryOf(idOf(c)) === home ? L : O).push(c); });
    if (!L.length || !O.length) return;
    var out = [], li = 0, oi = 0, i = 0;
    while (li < L.length || oi < O.length) {
      var want = PATTERN[i % PATTERN.length]; i++;
      if (want === 'L' && li < L.length) out.push(L[li++]);
      else if (want === 'O' && oi < O.length) out.push(O[oi++]);
      else if (li < L.length) out.push(L[li++]);
      else out.push(O[oi++]);
    }
    var same = out.every(function(c, k){ return c === cards[k]; });
    if (same) return;
    out.forEach(function(c){ box.appendChild(c); });
  }

  function mixAll(){
    document.querySelectorAll('.video-feed').forEach(function(b){ mixContainer(b, '.video-card'); });
    document.querySelectorAll('.listing-grid').forEach(function(b){ mixContainer(b, '.listing-card'); });
  }

  /* =====================  3. TRANSLATE POSTS  ===================== */
  var cache = {};
  function langName(c){
    try { return new Intl.DisplayNames(['en'], { type:'language' }).of(c) || c; } catch (e) { return c; }
  }

  function chunks(text){
    var parts = String(text).match(/[^.!?\n]+[.!?\n]*/g) || [String(text)];
    var out = [], cur = '';
    parts.forEach(function(p){
      if ((cur + p).length > 440 && cur) { out.push(cur); cur = p; } else cur += p;
    });
    if (cur) out.push(cur);
    return out;
  }

  async function mt(text, from, to){
    text = String(text || '');
    if (!text.trim() || from === to) return text;
    var key = from + '>' + to + ':' + text;
    if (cache[key]) return cache[key];
    var out = null;
    /* 1. the phone's own translator (Chrome), free and private */
    try {
      if (typeof self.Translator !== 'undefined') {
        var tr = await self.Translator.create({ sourceLanguage: from, targetLanguage: to });
        out = await tr.translate(text);
      }
    } catch (e) { out = null; }
    /* 2. free online translator */
    if (!out) {
      var res = [];
      var cs = chunks(text);
      for (var i = 0; i < cs.length; i++) {
        var r = await fetch('https://api.mymemory.translated.net/get?q=' + encodeURIComponent(cs[i]) + '&langpair=' + from + '|' + to);
        var j = await r.json();
        if (!j || !j.responseData || j.responseStatus !== 200 && j.responseStatus !== '200') throw new Error('translate failed');
        res.push(j.responseData.translatedText);
      }
      out = res.join('');
    }
    cache[key] = out;
    return out;
  }

  function listingById(id){ return (db.listings || []).find(function(l){ return l.id === id; }); }

  /* stamp the language on new posts */
  var _prevSubmit = window.submitListing;
  if (typeof _prevSubmit === 'function') {
    window.submitListing = async function(){
      var before = (db.listings || []).length;
      var r = await _prevSubmit.apply(this, arguments);
      try {
        var u = me(), l = db.listings[0];
        if (u && l && db.listings.length > before && l.sellerId === u.id && !l.lang) { l.lang = curLang(); saveDB(); }
      } catch (e) {}
      return r;
    };
  }

  function mkBtn(label, handler){
    var b = document.createElement('button');
    b.type = 'button'; b.className = 'vx-trbtn'; b.textContent = label;
    b.addEventListener('click', function(ev){ ev.stopPropagation(); ev.preventDefault(); handler(b); });
    return b;
  }

  /* generic: swap text of some elements, and swap back */
  function wire(btn, items, from, to){
    var showing = false;
    items.forEach(function(it){ if (it.orig === undefined) it.orig = it.get(); });
    btn.onclick = null;
    btn.addEventListener('click', async function(){
      if (btn.getAttribute('data-busy')) return;
      if (showing) {
        items.forEach(function(it){ it.set(it.orig); });
        btn.textContent = '🌐 Translate to ' + langName(to); showing = false; return;
      }
      btn.setAttribute('data-busy', '1'); btn.textContent = '🌐 Translating…';
      try {
        for (var i = 0; i < items.length; i++) items[i].set(await mt(items[i].orig, from, to));
        btn.textContent = '↩ Show original (' + langName(from) + ')'; showing = true;
      } catch (e) {
        btn.textContent = '🌐 Could not translate. Tap to try again.';
      }
      btn.removeAttribute('data-busy');
    });
  }

  function enhancePosts(){
    var to = curLang();

    /* post page */
    var m = /^#\/listing\/([^/?]+)/.exec(location.hash || '');
    if (m) {
      var l = listingById(m[1]);
      var title = document.querySelector('.detail-title');
      if (l && title && !document.getElementById('vx-trpost')) {
        var from = l.lang || 'en';
        if (from !== to) {
          var desc = document.querySelector('.tab-panel p');
          var b = document.createElement('button');
          b.type = 'button'; b.id = 'vx-trpost'; b.className = 'vx-trbtn'; b.textContent = '🌐 Translate to ' + langName(to);
          title.insertAdjacentElement('afterend', b);
          var items = [{ get:function(){ return title.textContent; }, set:function(v){ title.textContent = v; } }];
          if (desc) items.push({ get:function(){ return desc.textContent; }, set:function(v){ desc.textContent = v; } });
          wire(b, items, from, to);
        }
      }
    }

    /* home video cards */
    document.querySelectorAll('.video-card').forEach(function(card){
      if (card.querySelector('.vx-trbtn')) return;
      var id = idOf(card), l = id && listingById(id);
      if (!l) return;
      var from = l.lang || 'en';
      if (from === to) return;
      var p = card.querySelector('.video-info p');
      if (!p) return;
      var b = document.createElement('button');
      b.type = 'button'; b.className = 'vx-trbtn'; b.textContent = '🌐 Translate to ' + langName(to);
      p.insertAdjacentElement('afterend', b);
      wire(b, [{ get:function(){ return p.textContent; }, set:function(v){ p.textContent = v; } }], from, to);
    });
  }

  /* run after every screen change */
  var t = null;
  function soon(){ clearTimeout(t); t = setTimeout(function(){ try { mixAll(); enhancePosts(); } catch (e) { console.warn('geo/translate', e); } }, 80); }
  function boot(){
    var app = document.getElementById('app');
    if (app && window.MutationObserver) new MutationObserver(soon).observe(app, { childList:true, subtree:true });
    window.addEventListener('hashchange', soon);
    soon();
    start();
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot); else boot();
})();
</script>

<script>
(function(){
  'use strict';

  var ICE = [{ urls:'stun:stun.l.google.com:19302' }, { urls:'stun:stun1.l.google.com:19302' }];
  var STALE_MS = 75000;      /* a live with no heartbeat for this long is treated as ended */
  var HOLD_MS  = 600;        /* long-press time */

  function cloud(){ return !!(window.VXC && VXC.on && VXC.fs); }
  function union(x){ return firebase.firestore.FieldValue.arrayUnion(x); }
  function hostOf(el){
    var m = /openSellerProfile\('([^']*)'\)/.exec(el.getAttribute('onclick') || '');
    return m ? m[1].replace(/&#39;/g, "'").replace(/&amp;/g, '&') : '';
  }

  /* =====================  WHO IS LIVE  ===================== */
  var liveHosts = {};            /* hostId -> { name, seenAt } */
  var listening = false;
  window.vxIsLive = function(id){ var h = liveHosts[id]; return !!h && (Date.now() - h.seenAt) < STALE_MS; };

  function listenLives(){
    if (listening || !cloud()) return;
    listening = true;
    VXC.fs.collection('lives').onSnapshot(function(snap){
      var next = {};
      snap.forEach(function(d){
        var x = d.data() || {};
        if (!x.active) return;
        var prev = liveHosts[d.id];
        /* receipt time on THIS phone: changes whenever the host's heartbeat changes */
        next[d.id] = { name:x.name, hb:x.hb, seenAt: (prev && prev.hb === x.hb) ? prev.seenAt : Date.now() };
      });
      liveHosts = next;
      paint();
      if (viewing && !window.vxIsLive(viewing.hostId)) endViewer('This live has ended.');
    }, function(e){ console.warn('lives listener', e); });
  }

  function paint(){
    document.querySelectorAll('.vs-profile').forEach(function(av){
      var id = hostOf(av);
      if (!id) return;
      var on = window.vxIsLive(id);
      if (av.classList.contains('vx-live') !== on) av.classList.toggle('vx-live', on);
      if (on) av.title = 'Live now'; 
    });
  }
  setInterval(paint, 15000);   /* also drops rings of lives that stopped sending heartbeats */

  /* =====================  TAP / HOLD ON THE CIRCLE  ===================== */
  function wire(av){
    if (av.getAttribute('data-vxw')) return;
    av.setAttribute('data-vxw', '1');
    var id = hostOf(av), timer = null, held = false;
    function live(){ return window.vxIsLive(id); }
    av.addEventListener('pointerdown', function(e){
      if (e.target.closest && e.target.closest('.vx-plus')) return;
      if (!live()) return;
      held = false; clearTimeout(timer);
      timer = setTimeout(function(){
        held = true;
        try { if (navigator.vibrate) navigator.vibrate(30); } catch (x) {}
        if (typeof openSellerProfile === 'function') openSellerProfile(id);
      }, HOLD_MS);
    });
    ['pointerup', 'pointerleave', 'pointercancel'].forEach(function(t){
      av.addEventListener(t, function(){ clearTimeout(timer); });
    });
    av.addEventListener('contextmenu', function(e){ if (live()) e.preventDefault(); });
    /* capture phase: runs before the old "open profile" click, and replaces it only while live */
    av.addEventListener('click', function(e){
      if (e.target.closest && e.target.closest('.vx-plus')) return;
      if (!live()) return;
      e.stopImmediatePropagation(); e.preventDefault();
      if (held) { held = false; return; }
      window.vxWatchLive(id);
    }, true);
  }

  /* =====================  WATCHING A LIVE  ===================== */
  var viewing = null;

  function endViewer(msg){
    if (!viewing) return;
    var v = viewing; viewing = null;
    try { v.unsub && v.unsub(); } catch (e) {}
    try { v.pc && v.pc.close(); } catch (e) {}
    try { v.ref && v.ref.delete(); } catch (e) {}
    clearTimeout(v.timer);
    var st = document.getElementById('vx-lv-st');
    if (msg && st) { st.textContent = msg; setTimeout(function(){ var o = document.getElementById('vx-live-view'); if (o) o.remove(); }, 2200); }
    else { var o = document.getElementById('vx-live-view'); if (o) o.remove(); }
  }
  window.vxCloseLive = function(){ endViewer(); };

  window.vxWatchLive = async function(hostId){
    if (viewing) endViewer();
    if (!cloud()) { toast('Live needs the online site', 'err'); return; }
    if (!VXC.uid) { toast('Please sign in to watch live', 'err'); location.hash = '#/auth'; return; }
    if (hostId === VXC.uid) { toast('This is your own live'); return; }

    var o = document.createElement('div');
    o.id = 'vx-live-view';
    o.innerHTML = '<video id="vx-lv" autoplay playsinline></video>' +
      '<div class="top"><div><span class="tag">● LIVE</span><b>' + esc((liveHosts[hostId] && liveHosts[hostId].name) || 'Live') + '</b></div>' +
      '<button class="x" onclick="vxCloseLive()" aria-label="Close">✕</button></div>' +
      '<div class="st" id="vx-lv-st">Connecting…</div>';
    document.body.appendChild(o);
    var video = document.getElementById('vx-lv'), st = document.getElementById('vx-lv-st');

    var pc = new RTCPeerConnection({ iceServers: ICE });
    var ref = VXC.fs.collection('lives').doc(hostId).collection('viewers').doc(VXC.uid);
    var v = viewing = { hostId:hostId, pc:pc, ref:ref, unsub:null, timer:null };
    var remoteSet = false, docReady = false, outIce = [], inIce = {}, pendingIce = [];

    pc.ontrack = function(e){
      video.srcObject = e.streams[0];
      var p = video.play(); if (p && p.catch) p.catch(function(){ video.muted = true; video.play(); });
      st.textContent = '';
    };
    pc.onicecandidate = function(e){
      if (!e.candidate) return;
      var s = JSON.stringify(e.candidate);
      if (docReady) ref.update({ vIce: union(s) }).catch(function(){}); else outIce.push(s);
    };
    pc.onconnectionstatechange = function(){
      if (pc.connectionState === 'failed') st.textContent = 'Connection failed. Check your network and try again.';
    };
    function applyIce(list){
      (list || []).forEach(function(s){
        if (inIce[s]) return; inIce[s] = 1;
        if (!remoteSet) { pendingIce.push(s); return; }
        pc.addIceCandidate(JSON.parse(s)).catch(function(){});
      });
    }

    try {
      pc.addTransceiver('video', { direction:'recvonly' });
      pc.addTransceiver('audio', { direction:'recvonly' });
      var offer = await pc.createOffer();
      await pc.setLocalDescription(offer);
      try { await ref.delete(); } catch (e) {}
      await ref.set({ offer: JSON.stringify(pc.localDescription), vIce: [], createdAt: Date.now() });
      docReady = true;
      outIce.forEach(function(s){ ref.update({ vIce: union(s) }).catch(function(){}); });
      v.unsub = ref.onSnapshot(async function(snap){
        if (!viewing || viewing !== v || !snap.exists) return;
        var d = snap.data() || {};
        if (d.answer && !remoteSet) {
          await pc.setRemoteDescription(JSON.parse(d.answer));
          remoteSet = true;
          pendingIce.splice(0).forEach(function(s){ pc.addIceCandidate(JSON.parse(s)).catch(function(){}); });
        }
        applyIce(d.bIce);
      });
      v.timer = setTimeout(function(){
        if (viewing === v && !video.srcObject) st.textContent = 'Could not connect. The host may be offline or on a strict network.';
      }, 20000);
    } catch (e) {
      console.warn('watch live', e);
      st.textContent = 'Could not start. Please try again.';
    }
  };

  /* =====================  GOING LIVE (broadcaster side)  ===================== */
  var bc = null;

  async function answerViewer(vid, d){
    var rec = { pc:null, seen:{}, remoteSet:false, queue:[], ref: bc.ref.collection('viewers').doc(vid) };
    bc.pcs[vid] = rec;
    var pc = rec.pc = new RTCPeerConnection({ iceServers: ICE });
    liveStream.getTracks().forEach(function(t){ pc.addTrack(t, liveStream); });
    pc.onicecandidate = function(e){
      if (e.candidate) rec.ref.update({ bIce: union(JSON.stringify(e.candidate)) }).catch(function(){});
    };
    await pc.setRemoteDescription(JSON.parse(d.offer));
    rec.remoteSet = true;
    var ans = await pc.createAnswer();
    await pc.setLocalDescription(ans);
    await rec.ref.update({ answer: JSON.stringify(pc.localDescription) });
    feedIce(rec, d.vIce);
  }
  function feedIce(rec, list){
    (list || []).forEach(function(s){
      if (rec.seen[s]) return; rec.seen[s] = 1;
      if (rec.pc && rec.remoteSet) rec.pc.addIceCandidate(JSON.parse(s)).catch(function(){});
    });
  }

  function startBroadcast(){
    if (bc || !cloud() || !VXC.uid) return;
    var u = me(); if (!u) return;
    var uid = VXC.uid, ref = VXC.fs.collection('lives').doc(uid);
    bc = { uid:uid, ref:ref, pcs:{}, hbT:null, unsub:null };
    ref.set({ uid:uid, name:u.name, active:true, startedAt:Date.now(), hb:Date.now() }).catch(function(e){ console.warn('go live', e); });
    bc.hbT = setInterval(function(){ ref.update({ hb:Date.now() }).catch(function(){}); }, 20000);
    bc.unsub = ref.collection('viewers').onSnapshot(function(snap){
      snap.docChanges().forEach(function(ch){
        var vid = ch.doc.id, d = ch.doc.data() || {};
        if (ch.type === 'removed') {
          if (bc && bc.pcs[vid]) { try { bc.pcs[vid].pc.close(); } catch (e) {} delete bc.pcs[vid]; }
          return;
        }
        var rec = bc && bc.pcs[vid];
        if (!rec && d.offer && !d.answer) answerViewer(vid, d).catch(function(e){ console.warn('answer viewer', e); });
        else if (rec) feedIce(rec, d.vIce);
      });
    });
  }

  function stopBroadcast(){
    if (!bc) return;
    var b = bc; bc = null;
    clearInterval(b.hbT);
    try { b.unsub && b.unsub(); } catch (e) {}
    Object.keys(b.pcs).forEach(function(vid){
      try { b.pcs[vid].pc.close(); } catch (e) {}
      try { b.ref.collection('viewers').doc(vid).delete(); } catch (e) {}
    });
    try { b.ref.delete(); } catch (e) {}
  }

  function checkBroadcast(){
    var on = !!document.getElementById('live-ui') && typeof liveStream !== 'undefined' && !!liveStream;
    if (on && !bc) startBroadcast();
    if (!on && bc) stopBroadcast();
  }
  window.addEventListener('pagehide', function(){ try { stopBroadcast(); endViewer(); } catch (e) {} });

  /* =====================  KEEP IN STEP WITH THE SCREEN  ===================== */
  var t = null;
  function soon(){
    clearTimeout(t);
    t = setTimeout(function(){
      try {
        listenLives();
        document.querySelectorAll('.vs-profile').forEach(wire);
        paint();
        checkBroadcast();
      } catch (e) { console.warn('live', e); }
    }, 60);
  }
  function boot(){
    if (window.MutationObserver) new MutationObserver(soon).observe(document.body, { childList:true, subtree:true });
    soon();
    setInterval(function(){ listenLives(); }, 3000);   /* cloud may start a moment after the page */
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot); else boot();
})();
</script>

<script>

  /* ---------- Switches you can change ---------- */

  var MAX_REC_SEC = 300;       /* longest voice note (5 minutes) */

  function union(x){ return firebase.firestore.FieldValue.arrayUnion(x); }
  function curChatId(){ var m = /^#\/chats\/([^/?]+)/.exec(location.hash || ''); return m ? m[1] : null; }
  function chatById(id){ return (db.chats || []).find(function(c){ return c.id === id; }); }
  function fmt(s){ s = Math.max(0, Math.round(s)); var m = Math.floor(s / 60), r = s % 60; return m + ':' + (r < 10 ? '0' : '') + r; }

  /* =====================  MEDIA STORAGE (this phone)  ===================== */
  function idb(){
    return new Promise(function(res, rej){
      var r = indexedDB.open('veritas_media', 1);
      r.onupgradeneeded = function(){ r.result.createObjectStore('m'); };
      r.onsuccess = function(){ res(r.result); };
      r.onerror = function(){ rej(r.error); };
    });
  }
  async function putBlob(id, blob){
    var d = await idb();
    return new Promise(function(res, rej){
      var t = d.transaction('m', 'readwrite');
      t.objectStore('m').put(blob, id);
      t.oncomplete = function(){ res(); };
      t.onerror = function(){ rej(t.error); };
    });
  }
  async function getBlob(id){
    var d = await idb();
    return new Promise(function(res, rej){
      var q = d.transaction('m').objectStore('m').get(id);
      q.onsuccess = function(){ res(q.result); };
      q.onerror = function(){ rej(q.error); };
    });
  }

  /* =====================  SENDING  ===================== */
  function pushMsg(chatId, text, media){
    var u = me(), chat = chatById(chatId);
    if (!u || !chat) return;
    var msg = {
      id: uid('m'), senderId: u.id, senderName: u.name, text: text,
      time: new Date().toLocaleTimeString('en-US', { hour:'2-digit', minute:'2-digit' })
    };
    if (media) msg.media = media;
    chat.messages.push(msg);
    saveDB();
    if (curChatId() === chatId) window.renderChatRoom(chatId);
  }

  var LABEL = { audio:'🎤 Voice note', image:'📷 Photo', gif:'GIF', video:'🎥 Video' };
  async function sendMedia(chatId, kind, blob, extra){
    var id = uid('md') + Date.now().toString(36);
    await putBlob(id, blob);
    pushMsg(chatId, LABEL[kind] || 'Media', Object.assign({ id:id, kind:kind, mime:blob.type || '' }, extra || {}));
  }

  async function handleFiles(chatId, files){
    for (var i = 0; i < files.length; i++) {
      var f = files[i];
      try {
        if (f.type === 'image/gif') await sendMedia(chatId, 'gif', f);
        else if (/^image\//.test(f.type)) {
          var du = await resizeImage(f, 1400, 0.75);
          var b = await (await fetch(du)).blob();
          await sendMedia(chatId, 'image', b);
        } else if (/^video\//.test(f.type)) {
          toast('Videos cannot be sent in chat. Send the link of the video on the website instead.', 'err');
        } else toast('That file type is not supported', 'err');
      } catch (e) { console.warn(e); toast('Could not send that file', 'err'); }
    }
  }

  /* =====================  VOICE NOTES  ===================== */
  var rec = null;

  async function startRec(chatId){
    if (rec) return;
    if (!navigator.mediaDevices || !window.MediaRecorder) return toast('Voice notes are not supported on this browser', 'err');
    var stream;
    try { stream = await navigator.mediaDevices.getUserMedia({ audio:true }); }
    catch (e) { return toast('Allow the microphone to record a voice note', 'err'); }
    var mime = ['audio/webm;codecs=opus', 'audio/webm', 'audio/mp4', 'audio/ogg'].find(function(m){
      return MediaRecorder.isTypeSupported && MediaRecorder.isTypeSupported(m);
    }) || '';
    var mr = new MediaRecorder(stream, mime ? { mimeType:mime } : undefined);
    var r = rec = { mr:mr, stream:stream, chunks:[], t0:Date.now(), chatId:chatId, cancel:false, timer:null, mime:mime };
    mr.ondataavailable = function(e){ if (e.data && e.data.size) r.chunks.push(e.data); };
    mr.onstop = async function(){
      clearInterval(r.timer);
      r.stream.getTracks().forEach(function(t){ t.stop(); });
      if (rec === r) rec = null;
      var area = document.querySelector('.chat-input-area');
      if (area) { area.classList.remove('vx-rec'); var bar = area.querySelector('.vx-recbar'); if (bar) bar.remove(); }
      if (r.cancel) return;
      var dur = Math.round((Date.now() - r.t0) / 1000);
      if (dur < 1 || !r.chunks.length) return toast('Voice note was too short');
      var blob = new Blob(r.chunks, { type: mr.mimeType || r.mime || 'audio/webm' });
      try { await sendMedia(r.chatId, 'audio', blob, { dur:dur }); }
      catch (e) { toast('Could not send voice note', 'err'); }
    };
    mr.start();
    var area = document.querySelector('.chat-input-area');
    if (area) {
      area.classList.add('vx-rec');
      var bar = document.createElement('div');
      bar.className = 'vx-recbar';
      bar.innerHTML = '<span class="vx-recdot"></span><span class="vx-rectime" id="vx-rt">0:00</span>' +
        '<button class="vx-ibtn" id="vx-rc" aria-label="Cancel">✕</button><button class="vx-ibtn mic" id="vx-rs" aria-label="Send voice note">➤</button>';
      area.appendChild(bar);
      document.getElementById('vx-rc').onclick = function(){ stopRec(false); };
      document.getElementById('vx-rs').onclick = function(){ stopRec(true); };
    }
    r.timer = setInterval(function(){
      var s = (Date.now() - r.t0) / 1000;
      var el = document.getElementById('vx-rt'); if (el) el.textContent = fmt(s);
      if (s >= MAX_REC_SEC) stopRec(true);
    }, 250);
  }
  function stopRec(send){
    if (!rec) return;
    rec.cancel = !send;
    try { if (rec.mr.state !== 'inactive') rec.mr.stop(); } catch (e) {}
  }

  /* =====================  SHOWING MEDIA IN BUBBLES  ===================== */
  function viewImage(src){
    var v = document.createElement('div');

  var EXPIRE_MS = 30 * 24 * 3600 * 1000;   /* cloud copies are kept for 1 month */
  function expiredEl(wrap){ wrap.textContent = '⌛ File expired'; wrap.style.opacity = '.7'; wrap.style.fontSize = '13px'; return wrap; }

  /* LOCAL FIRST: if this phone already has the file, use it. Otherwise fetch it once from the
     cloud, keep a copy on this phone, and show that copy. If the cloud copy is gone: "File expired". */
  async function mediaEl(md, ts){
    var wrap = document.createElement('div');
    wrap.className = 'vx-media';
    var src = '', direct = false;
    if (md.id) { try { var b = await getBlob(md.id); if (b) src = URL.createObjectURL(b); } catch (e) {} }
    if (!src && md.url) {
      if (md.url.indexOf('data:') === 0) src = md.url;
      else if (ts && Date.now() - ts > EXPIRE_MS) return expiredEl(wrap);
      else {
        try {
          var r = await fetch(md.url);
          if (r.status === 404 || r.status === 410 || r.status === 403) return expiredEl(wrap);
          if (r.ok) {
            var blob = await r.blob();
            var nid = 'rx' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
            await putBlob(nid, blob);
            md.id = nid;
            try { saveDB(); } catch (e) {}
            src = URL.createObjectURL(blob);
          } else { src = md.url; direct = true; }
        } catch (e) { src = md.url; direct = true; }   /* host blocks saving: play straight from the cloud */
      }
    }
    if (!src) { wrap.textContent = '⚠️ Not available on this phone'; return wrap; }
    function bad(){ if (direct) { wrap.innerHTML = ''; expiredEl(wrap); } }
    if (md.kind === 'audio') {
      var a = document.createElement('audio'); a.controls = true; a.preload = 'metadata'; a.src = src; a.onerror = bad; wrap.appendChild(a);
      if (md.dur) { var d = document.createElement('div'); d.className = 'dur'; d.textContent = '🎤 ' + fmt(md.dur); wrap.appendChild(d); }
    } else if (md.kind === 'video') {
      var v = document.createElement('video'); v.controls = true; v.playsInline = true; v.preload = 'metadata'; v.src = src; v.onerror = bad; wrap.appendChild(v);
    } else {
      var im = document.createElement('img'); im.src = src; im.loading = 'lazy'; im.onerror = bad;
      im.onclick = function(){ viewImage(src); };
      wrap.appendChild(im);
    }
    return wrap;
  }

  /* video links (and any other link) typed in chat become tappable */
  function linkify(b){
    if (!b || b.querySelector('a.vx-link')) return;
    Array.prototype.slice.call(b.childNodes).forEach(function(n){
      if (n.nodeType !== 3 || !/https?:\/\//i.test(n.nodeValue)) return;
      var parts = n.nodeValue.split(/(https?:\/\/[^\s<>"']+)/i), frag = document.createDocumentFragment();
      parts.forEach(function(t){
        if (/^https?:\/\//i.test(t)) {
          var a = document.createElement('a');
          a.className = 'vx-link'; a.href = t; a.target = '_blank'; a.rel = 'noopener';
          a.style.cssText = 'color:inherit;text-decoration:underline;font-weight:700;word-break:break-all';
          a.textContent = '▶ ' + t.replace(/^https?:\/\//i, '').slice(0, 48);
          frag.appendChild(a);
        } else if (t) frag.appendChild(document.createTextNode(t));
      });
      n.parentNode.replaceChild(frag, n);
    });
  }

  function decorate(chatId){
    var chat = chatById(chatId); if (!chat) return;
    var bubbles = document.querySelectorAll('#chat-messages .chat-bubble');
    chat.messages.forEach(function(m, i){
      if (!m.media) { try { linkify(bubbles[i]); } catch (e) {} return; }
      var b = bubbles[i]; if (!b) return;
      Array.prototype.slice.call(b.childNodes).forEach(function(n){ if (n.nodeType === 3 && n.nodeValue.trim()) n.remove(); });
      mediaEl(m.media, m.ts).then(function(el){
        var time = b.querySelector('div:last-child');
        if (time && time.parentNode === b) b.insertBefore(el, time); else b.appendChild(el);
        var box = document.getElementById('chat-messages');
        if (box && (m === chat.messages[chat.messages.length - 1])) box.scrollTop = box.scrollHeight;
      });
    });
  }

  var call = null;

  function callUI(name, video){

  function wirePc(pc){
    pc.ontrack = function(e){
      var rv = document.getElementById('vx-rv');
      if (rv) { rv.srcObject = e.streams[0]; var p = rv.play(); if (p && p.catch) p.catch(function(){}); }
      var o = document.getElementById('vx-call'); if (o) o.classList.add('conn');
    };
    pc.onconnectionstatechange = function(){
      if (!call || call.pc !== pc) return;
      if (pc.connectionState === 'connected') {
        clearTimeout(call.ring);
        if (!call.t0) {
          call.t0 = Date.now();
          call.timer = setInterval(function(){ if (call && call.t0) setStatus(fmt((Date.now() - call.t0) / 1000)); }, 1000);
          setStatus('0:00');
        }
      } else if (pc.connectionState === 'failed') endCall(true, 'Call connection failed');
    };
  }

  function flushIce(){
    if (!call || !call.remoteSet) return;
    call.queue.splice(0).forEach(function(s){ call.pc.addIceCandidate(JSON.parse(s)).catch(function(){}); });
  }

  function onCallSnap(snap){
    if (!call || !snap.exists) return;
    var d = snap.data() || {};
    if (d.status === 'ended' || d.status === 'declined') { endCall(false, d.status === 'declined' ? 'Call declined' : 'Call ended'); return; }
    if (call.isCaller && d.answer && !call.remoteSet && !call.settingRemote) {
      call.settingRemote = true;
      call.pc.setRemoteDescription(JSON.parse(d.answer)).then(function(){
        if (!call) return; call.remoteSet = true; flushIce(); setStatus('Connecting…');
      }).catch(function(e){ console.warn('answer', e); });
    }
    (d[call.icIn] || []).forEach(function(s){
      if (call.seen[s]) return; call.seen[s] = 1; call.queue.push(s);
    });
    flushIce();
  }

  async function getMedia(video){
    return navigator.mediaDevices.getUserMedia({ audio:true, video: video ? { facingMode:'user' } : false });
  }

  async function startCall(chatId, video){
    if (call) return toast('You are already in a call');
    if (!cloud()) return toast('Calls need the online site and a signed-in account', 'err');
    if (!navigator.mediaDevices || !window.RTCPeerConnection) return toast('This browser cannot make calls', 'err');
    var u = me(), chat = chatById(chatId);
    var peer = chat && chat.members.find(function(x){ return x !== u.id; });
    if (!peer) return toast('Nobody to call here', 'err');
    var peerUser = userById(peer);
    var name = peerUser ? peerUser.name : 'Call';
    var stream;
    try { stream = await getMedia(video); }
    catch (e) { return toast('Allow the microphone' + (video ? ' and camera' : '') + ' to call', 'err'); }

    var ref = VXC.fs.collection('calls').doc(uid('call') + Date.now().toString(36));
    var pc = new RTCPeerConnection({ iceServers: ICE });
    call = { id:ref.id, ref:ref, pc:pc, local:stream, isCaller:true, chatId:chatId, video:video, name:name,
      icOut:'cIce', icIn:'eIce', seen:{}, queue:[], remoteSet:false, settingRemote:false, t0:0, timer:null, ring:null, unsub:null };
    callUI(name, video);
    wirePc(pc);
    stream.getTracks().forEach(function(t){ pc.addTrack(t, stream); });
    var docReady = false, outIce = [];
    pc.onicecandidate = function(e){
      if (!e.candidate) return;
      var s = JSON.stringify(e.candidate);
      if (docReady) ref.update({ cIce: union(s) }).catch(function(){}); else outIce.push(s);
    };
    try {
      var offer = await pc.createOffer();
      await pc.setLocalDescription(offer);
      await ref.set({ id:ref.id, callerId:VXC.uid, callerName:u.name, calleeId:peer, video:!!video, status:'ringing',
        offer:JSON.stringify(pc.localDescription), cIce:[], eIce:[], createdAt:Date.now() });
      docReady = true;
      outIce.forEach(function(s){ ref.update({ cIce: union(s) }).catch(function(){}); });
      call.unsub = ref.onSnapshot(onCallSnap, function(e){ console.warn('call listener', e); });
      call.ring = setTimeout(function(){ if (call && !call.t0) endCall(true, 'No answer'); }, 45000);
    } catch (e) {
      console.warn('start call', e);
      endCall(false, 'Could not start the call. Check the Firestore rules.');
    }
  }

  async function acceptCall(id, d){
    if (call) return;
    var stream;
    try { stream = await getMedia(!!d.video); }
    catch (e) { toast('Allow the microphone' + (d.video ? ' and camera' : '') + ' to answer', 'err'); VXC.fs.collection('calls').doc(id).update({ status:'declined' }).catch(function(){}); return; }
    var ref = VXC.fs.collection('calls').doc(id);
    var pc = new RTCPeerConnection({ iceServers: ICE });
    call = { id:id, ref:ref, pc:pc, local:stream, isCaller:false, video:!!d.video, name:d.callerName || 'Call',
      icOut:'eIce', icIn:'cIce', seen:{}, queue:[], remoteSet:false, settingRemote:false, t0:0, timer:null, ring:null, unsub:null };
    callUI(call.name, call.video);
    wirePc(pc);
    stream.getTracks().forEach(function(t){ pc.addTrack(t, stream); });
    pc.onicecandidate = function(e){
      if (e.candidate) ref.update({ eIce: union(JSON.stringify(e.candidate)) }).catch(function(){});
    };
    try {
      await pc.setRemoteDescription(JSON.parse(d.offer));
      call.remoteSet = true;
      var ans = await pc.createAnswer();
      await pc.setLocalDescription(ans);
      await ref.update({ answer: JSON.stringify(pc.localDescription), status:'active' });
      setStatus('Connecting…');
      call.unsub = ref.onSnapshot(onCallSnap, function(e){ console.warn('call listener', e); });
    } catch (e) {
      console.warn('accept call', e);
      endCall(true, 'Could not connect the call');
    }
  }

  function endCall(notify, msg){
    if (!call) return;
    var c = call; call = null;
    clearInterval(c.timer); clearTimeout(c.ring);
    try { c.unsub && c.unsub(); } catch (e) {}
    if (notify) c.ref.update({ status:'ended' }).catch(function(){});
    try { c.pc.close(); } catch (e) {}
    try { c.local.getTracks().forEach(function(t){ t.stop(); }); } catch (e) {}
    var o = document.getElementById('vx-call'); if (o) o.remove();
    if (msg) toast(msg);
    if (c.isCaller) {
      setTimeout(function(){ c.ref.delete().catch(function(){}); }, 4000);
      try {
        var secs = c.t0 ? (Date.now() - c.t0) / 1000 : 0;
        pushMsg(c.chatId, (c.video ? '🎥 Video call' : '📞 Voice call') + (c.t0 ? ' · ' + fmt(secs) : ' · not answered'));
      } catch (e) {}
    }
  }

  /* ---------- incoming calls ---------- */
  var listenUid = null, listenOff = null, handled = {};

  function hideIncoming(){ var i = document.getElementById('vx-incoming'); if (i) i.remove(); }

  function showIncoming(id, d){
    if (call) { VXC.fs.collection('calls').doc(id).update({ status:'declined' }).catch(function(){}); return; }
    hideIncoming();
    var o = document.createElement('div');
    o.id = 'vx-incoming'; o.setAttribute('data-id', id);
    o.innerHTML = '<div class="av">' + ini(d.callerName) + '</div><h2 style="font-size:26px">' + esc(d.callerName || 'Someone') + '</h2>' +
      '<p style="opacity:.8;margin-top:6px">Incoming ' + (d.video ? 'video' : 'voice') + ' call…</p>' +
      '<div class="row2"><button class="no" aria-label="Decline">📵</button><button class="yes" aria-label="Answer">📞</button></div>';
    document.body.appendChild(o);
    try { if (navigator.vibrate) navigator.vibrate([400, 200, 400, 200, 400]); } catch (e) {}
    o.querySelector('.no').onclick = function(){ hideIncoming(); VXC.fs.collection('calls').doc(id).update({ status:'declined' }).catch(function(){}); };
    o.querySelector('.yes').onclick = function(){ hideIncoming(); acceptCall(id, d); };
  }

  function listenCalls(){
    if (!cloud()) return;
    if (listenUid === VXC.uid) return;
    if (listenOff) { try { listenOff(); } catch (e) {} listenOff = null; }
    listenUid = VXC.uid;
    listenOff = VXC.fs.collection('calls').where('calleeId', '==', VXC.uid).onSnapshot(function(snap){
      snap.docChanges().forEach(function(ch){
        if (ch.type === 'removed') return;
        var d = ch.doc.data() || {}, id = ch.doc.id;
        var inc = document.getElementById('vx-incoming');
        if (d.status !== 'ringing') { if (inc && inc.getAttribute('data-id') === id) hideIncoming(); return; }
        if (handled[id] || Date.now() - (d.createdAt || 0) > 60000) return;
        handled[id] = 1;
        showIncoming(id, d);
      });
    }, function(e){ console.warn('calls listener', e); });
  }
  setInterval(function(){ try { listenCalls(); } catch (e) {} }, 3000);
  window.addEventListener('pagehide', function(){ try { if (call) endCall(true, ''); } catch (e) {} });
})();
</script>

<!-- ============================================================
  NEW ADDITION (round 2) - added only, nothing above was edited or removed
   1. Settings opens as a SIDE PANEL (about 3/4 of the screen). The strip on the
      left is empty: tap it (or swipe from the edge) to go back.
   2. Camera preview is a MIRROR (like Snapchat selfie): you turn left, the

   3. Admin password with ANOTHER email = Team Room REQUEST. You (admin) must accept
      it in the Admin Room before that person is added to the Team Room.
   4. No more buyer / seller choice at sign-up. Switch in Settings any time.
   5. Search page: fixed the invisible circle that blocked the keyboard, and the
      search now understands things like "2 bedroom flat", "3 bedroom flat",
      "family entertainment", "land in Lekki".
============================================================ -->
<style>
/* 1. side panel */
@keyframes vxslide{from{transform:translateX(100%)}to{transform:none}}
.modal-bg.vx-drawer{padding:0;align-items:stretch;justify-items:end;background:rgba(15,26,20,.55)}
.modal-bg.vx-drawer .modal{
  width:75% !important;max-width:420px !important;height:100%;max-height:none;
  border-radius:0;border:none;border-left:1px solid var(--line);
