}
/* 2. mirror preview */
.live-video{transform:scaleX(-1)}
/* 5. the decorative circle on the hero was sitting on top of the search box */
.hero::after{pointer-events:none}
.hero .searchbox,.hero .chips{position:relative;z-index:3}
</style>
<script>
(function(){
  'use strict';

  function cloud(){ return !!(window.VXC && VXC.on && VXC.fs && VXC.uid); }
  function iAmAdmin(){ if (window.VXC && VXC.on) return !!VXC.admin; var u = me(); return !!u && u.id === 'owner'; }
  function curChatId(){ var m = /^#\/chats\/([^/?]+)/.exec(location.hash || ''); return m ? m[1] : null; }

  /* =====================  1. SETTINGS AS A SIDE PANEL  ===================== */
  function asDrawer(){
    var bg = document.querySelector('#modal-root .modal-bg');
    if (bg) bg.classList.add('vx-drawer');
  }
  var _os = window.openSettings;
  window.openSettings = function(){
    var r = _os.apply(this, arguments);
    try { asDrawer(); addSwitch(); } catch (e) { console.warn(e); }
    return r;
  };
  var _pk = window.vxPicker;
  if (typeof _pk === 'function') {
    window.vxPicker = function(){
      var r = _pk.apply(this, arguments);
      try { asDrawer(); } catch (e) {}
      return r;
    };
  }

  /* =====================  4. SWITCH BUYER / SELLER (in Settings)  ===================== */
  function addSwitch(){
    var u = me();
    if (!u || u.id === 'owner' || document.getElementById('vx-switch')) return;
    var anchor = document.querySelector('#modal-root .set-item[onclick*="country"]');
    if (!anchor) return;
    var toSeller = u.accountType !== 'seller';
    anchor.insertAdjacentHTML('beforebegin',
      '<button id="vx-switch" class="set-item" onclick="vxSwitchRole()"><span class="ico">🔄</span>' +
      (toSeller ? 'Switch to Seller' : 'Switch to Buyer') +
      '<span style="font-size:12px;font-weight:500;color:var(--ink3)">Now: ' + (toSeller ? 'Buyer' : 'Seller') + '</span></button>');
  }

  function applyRole(u, role){
    u.accountType = role;
    if (role === 'seller') {
      if (u.stars === undefined) u.stars = 3;
      if (!u.transactions) u.transactions = [];
    }
    saveDB();
    closeModal();
    toast(role === 'seller' ? 'You are now a Seller. You can post properties.' : 'You are now a Buyer. You can browse and buy.', 'ok');
    if ((location.hash || '') === '#/dashboard') router(); else location.hash = '#/dashboard';
  }

  window.vxSwitchRole = function(){
    var u = me();
    if (!u || u.id === 'owner') return;
    if (u.accountType === 'seller') { applyRole(u, 'buyer'); return; }
    if (u.phone && u.sellerType) { applyRole(u, 'seller'); return; }
    $('#modal-root').innerHTML =
      '<div class="modal-bg vx-drawer" onclick="if(event.target===this)closeModal()"><div class="modal">' +
      '<h3>Become a seller</h3><p class="muted">Add your phone number so buyers can reach you.</p>' +
      '<label>Phone number</label><input id="vx-sw-phone" type="tel" placeholder="+234 ..." value="' + esc(u.phone || '') + '">' +
      '<label style="margin-top:12px">I am a...</label>' +
      '<select id="vx-sw-type"><option value="agent">Real Estate Agent</option><option value="owner">Direct Owner</option><option value="developer">Developer</option></select>' +
      '<button class="btn btn-primary btn-full" style="margin-top:18px" onclick="vxSwitchGo()">Continue</button></div></div>';
  };
  window.vxSwitchGo = function(){
    var u = me(); if (!u) return;
    var ph = (document.getElementById('vx-sw-phone') || {}).value || '';
    ph = ph.trim();
    if (!ph) return toast('Enter your phone number', 'err');
    u.phone = ph;
    u.sellerType = (document.getElementById('vx-sw-type') || {}).value || 'owner';
    applyRole(u, 'seller');
  };

  /* sign-up goes straight to one form (no buyer / seller choice) */
  var _rc = window.renderRoleChoice;
  window.renderRoleChoice = function(){
    if (me()) return _rc.apply(this, arguments);
    location.hash = '#/auth/buyer';
  };
  var _rbf = window.renderBuyerForm;
  window.renderBuyerForm = function(){
    var r = _rbf.apply(this, arguments);
    try {
      var sub = document.querySelector('.auth-sub');
      if (sub) sub.textContent = 'Create your account. You can switch between buying and selling any time in Settings.';
      var back = document.querySelector('.back-link');
      if (back) back.setAttribute('onclick', "location.hash='#/auth'");
    } catch (e) {}
    return r;
  };

  /* =====================  3. TEAM ROOM: ADMIN MUST ACCEPT  ===================== */
  var reqs = {};                                   /* cloud cache of requests (admin) */
  var ownOff = null, ownUid = null, admOff = null, admUid = null, tmOff = null, tmUid = null, admFirst = true;

  function teamIntent(email, pass){
    try { return !!pass && email !== vxAdminMail().toLowerCase() && vxAdminPassOk(pass); }
    catch (e) { return false; }
  }

  function ensureTeamRoom(memberId){
    var t = db.chats.find(function(c){ return c.id === 'team-room'; });
    if (!t) {
      t = { id:'team-room', type:'team', name:'Team Room', lga:'', members:[], messages:[{
        id:uid('m'), senderId:'system', senderName:'System', ts:0,
        time:new Date().toLocaleTimeString('en-US', { hour:'2-digit', minute:'2-digit' }),
        text:'Welcome to the Team Room. Helpers who maintain Veritas work here with the admin.'
      }] };
      db.chats.push(t);
    }
    if (memberId && t.members.indexOf(memberId) < 0) t.members.push(memberId);
    return t;
  }

  function sendRequest(u){
    var req = { id:u.id, uid:u.id, name:u.name, email:u.email, status:'pending', createdAt:Date.now() };
    if (cloud()) {
      VXC.fs.collection('teamRequests').doc(u.id).set(req).catch(function(e){
        console.warn('team request', e); toast('Could not send the Team Room request.', 'err');
      });
    } else {
      if (!db.teamRequests) db.teamRequests = [];
      if (!db.teamRequests.some(function(r){ return r.id === u.id; })) { db.teamRequests.push(req); saveDB(); }
    }
    toast('Team Room request sent. The admin must accept you first.', 'ok');
  }

  var _sb = window.saveBuyerDetails;
  window.saveBuyerDetails = async function(){
    var email = ((document.getElementById('b-email') || {}).value || '').trim().toLowerCase();
    var pass = (document.getElementById('b-pass') || {}).value || '';
    if (!teamIntent(email, pass)) return _sb.apply(this, arguments);

    if (window.VXC && VXC.on) {              /* online: normal sign-up, then the request */
      await _sb.apply(this, arguments);
      var u = me();
      if (u && u.id !== 'owner' && String(u.email || '').toLowerCase() === email) sendRequest(u);
      return;
    }
    var name = $('#b-name').value.trim(), state = $('#b-state').value, city = $('#b-city').value.trim();
    if (!name || !email || !state || !city) return alert('Please fill all fields');
    if (db.users.some(function(x){ return x.email.toLowerCase() === email; })) return alert('Email already registered');
    var id = uid('u');
    db.users.push({ id:id, name:name, email:email, password:pass, state:state, city:city, accountType:'buyer', kycStatus:'unverified', emailVerified:false, createdAt:new Date().toISOString().slice(0, 10) });
    db.session = id; saveDB();
    sendRequest(db.users.find(function(x){ return x.id === id; }));
    issueAndSendCode(db.users.find(function(x){ return x.id === id; }));
    location.hash = '#/auth/buyer/code';
  };

  var _ss = window.saveSellerDetails;
  window.saveSellerDetails = async function(){
    var email = ((document.getElementById('s-email') || {}).value || '').trim().toLowerCase();
    var pass = (document.getElementById('s-pass') || {}).value || '';
    if (!teamIntent(email, pass)) return _ss.apply(this, arguments);

    if (window.VXC && VXC.on) {
      await _ss.apply(this, arguments);
      var u = me();
      if (u && u.id !== 'owner' && String(u.email || '').toLowerCase() === email) sendRequest(u);
      return;
    }
    var name = $('#s-name').value.trim(), phone = $('#s-phone').value.trim(), type = $('#s-type').value;
    if (!name || !email || !phone) return alert('Please fill all fields');
    if (db.users.some(function(x){ return x.email.toLowerCase() === email; })) return alert('Email already registered');
    var id = uid('u');
    db.users.push({ id:id, name:name, email:email, password:pass, phone:phone, accountType:'seller', sellerType:type, stars:3, transactions:[], emailVerified:false, kycStatus:'unverified', createdAt:new Date().toISOString().slice(0, 10) });
    db.session = id; saveDB();
    sendRequest(db.users.find(function(x){ return x.id === id; }));
    issueAndSendCode(db.users.find(function(x){ return x.id === id; }));
    location.hash = '#/auth/seller/code';
  };

  /* ----- admin side: list + accept / decline ----- */
  function allReqs(){
    return cloud() ? Object.keys(reqs).map(function(k){ return reqs[k]; }) : (db.teamRequests || []);
  }

  function reqRow(r, pending){
    var id = esc(r.id);
    return '<div style="background:var(--surface);border:2px solid ' + (pending ? 'var(--gold)' : 'var(--line)') + ';padding:14px 16px;margin-bottom:10px;border-radius:10px;">' +
      '<b>' + esc(r.name || '(no name)') + '</b>' +
      '<div style="font-size:13px;color:var(--ink2);word-break:break-all;">' + esc(r.email || '') + '</div>' +
      '<div style="margin-top:10px;display:flex;gap:8px;flex-wrap:wrap;">' +
      (pending
        ? '<button onclick="vxTeamDecide(\'' + id + '\',\'accepted\')" style="padding:10px 16px;background:var(--green);color:#fff;border-radius:6px;font-weight:bold;">✅ Accept</button>' +
          '<button onclick="vxTeamDecide(\'' + id + '\',\'declined\')" style="padding:10px 16px;background:var(--red);color:#fff;border-radius:6px;font-weight:bold;">❌ Decline</button>'
        : '<button onclick="vxTeamDecide(\'' + id + '\',\'declined\')" style="padding:10px 16px;background:var(--red);color:#fff;border-radius:6px;font-weight:bold;">Remove from team</button>') +
      '</div></div>';
  }

  function teamSection(){
    var list = allReqs().slice().sort(function(a, b){ return (b.createdAt || 0) - (a.createdAt || 0); });
    var pend = list.filter(function(r){ return r.status === 'pending'; });
    var acc = list.filter(function(r){ return r.status === 'accepted'; });
    return '<div id="vx-team"><h2 style="margin-top:24px;">Team Room requests (' + pend.length + ')</h2>' +
      '<button class="btn btn-gold" style="margin:10px 0;" onclick="vxOpenTeam()">🛠️ Open Team Room</button>' +
      (pend.length ? pend.map(function(r){ return reqRow(r, true); }).join('') : '<p>No one is waiting.</p>') +
      (acc.length ? '<h3 style="margin-top:16px;">In the Team Room (' + acc.length + ')</h3>' + acc.map(function(r){ return reqRow(r, false); }).join('') : '') +
      '<hr style="margin:30px 0;border-color:var(--line);"></div>';
  }

  window.vxOpenTeam = function(){
    ensureTeamRoom(me() ? me().id : 'owner'); saveDB();
    location.hash = '#/chats/team-room';
  };

  function afterDecision(id, status){
    var t = ensureTeamRoom('owner');
    var r = allReqs().find(function(x){ return x.id === id; });
    var nm = r ? r.name : 'Someone';
    var time = new Date().toLocaleTimeString('en-US', { hour:'2-digit', minute:'2-digit' });
    if (status === 'accepted') {
      if (t.members.indexOf(id) < 0) t.members.push(id);
      t.messages.push({ id:uid('m'), senderId:'system', senderName:'System', time:time, ts:Date.now(), text:nm + ' joined the Team Room.' });
    } else {
      t.members = t.members.filter(function(x){ return x !== id; });
    }
    saveDB();
    toast(status === 'accepted' ? 'Accepted: ' + nm : 'Declined: ' + nm, status === 'accepted' ? 'ok' : '');
    if ((location.hash || '') === '#/admin') window.renderAdminDash();
  }

  window.vxTeamDecide = function(id, status){
    if (!iAmAdmin()) { toast('Not allowed', 'err'); return; }
    if (cloud()) {
      VXC.fs.collection('teamRequests').doc(id).update({ status:status, decidedAt:Date.now() }).then(function(){
        if (reqs[id]) reqs[id].status = status;
        afterDecision(id, status);
      }).catch(function(e){ console.warn(e); toast('Could not save. Check the Firestore rules.', 'err'); });
    } else {
      var r = (db.teamRequests || []).find(function(x){ return x.id === id; });
      if (!r) return;
      r.status = status; saveDB(); afterDecision(id, status);
    }
  };

  var _rad = window.renderAdminDash;
  window.renderAdminDash = function(){
    var r = _rad.apply(this, arguments);
    try {
      var app = document.getElementById('app'), box = app && app.firstElementChild;
      if (box && iAmAdmin() && (location.hash || '') === '#/admin' && box.querySelector('h1') && !document.getElementById('vx-team')) {
        var back = box.querySelector('a.btn'), html = teamSection();
        if (back) back.insertAdjacentHTML('afterend', html); else box.insertAdjacentHTML('afterbegin', html);
      }
    } catch (e) { console.warn('team section', e); }
    return r;
  };

  /* ----- cloud listeners ----- */
  function startAdm(){
    if (admUid === VXC.uid) return;
    admUid = VXC.uid; admFirst = true;
    if (admOff) { try { admOff(); } catch (e) {} }
    admOff = VXC.fs.collection('teamRequests').onSnapshot(function(snap){
      snap.docChanges().forEach(function(ch){
        if (ch.type === 'removed') { delete reqs[ch.doc.id]; return; }
        var d = ch.doc.data() || {};
        reqs[ch.doc.id] = d;
        if (!admFirst && ch.type === 'added' && d.status === 'pending') toast('New Team Room request from ' + (d.name || 'someone'));
      });
      admFirst = false;
      var a = document.activeElement;
      if ((location.hash || '') === '#/admin' && iAmAdmin() && !(a && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName))) window.renderAdminDash();
    }, function(e){ console.warn('team requests listener', e); });
  }

  function startOwn(){
    if (ownUid === VXC.uid) return;
    ownUid = VXC.uid;
    if (ownOff) { try { ownOff(); } catch (e) {} }
    var me0 = VXC.uid;
    ownOff = VXC.fs.collection('teamRequests').doc(me0).onSnapshot(function(s){
      if (!s.exists) return;
      var d = s.data() || {};
      if (d.status === 'accepted') {
        var t0 = db.chats.find(function(c){ return c.id === 'team-room'; });
        var had = !!t0 && t0.members.indexOf(me0) > -1;
        ensureTeamRoom(me0); saveDB();
        if (!had) toast('You were accepted into the Team Room ✓', 'ok');
        startTeamMsgs();
      } else if (d.status === 'declined') {
        var t1 = db.chats.find(function(c){ return c.id === 'team-room'; });
        if (t1 && t1.members.indexOf(me0) > -1) { t1.members = t1.members.filter(function(x){ return x !== me0; }); saveDB(); toast('You were removed from the Team Room.', 'err'); }
      }
    }, function(e){ console.warn('own team request listener', e); });
  }

  /* Team Room messages are shared online (so you and your helpers see the same chat) */
  function startTeamMsgs(){
    if (!cloud() || tmUid === VXC.uid) return;
    tmUid = VXC.uid;
    if (tmOff) { try { tmOff(); } catch (e) {} }
    var t = ensureTeamRoom(iAmAdmin() ? 'owner' : VXC.uid);
    tmOff = VXC.fs.collection('teamMessages').orderBy('ts').onSnapshot(function(snap){
      var chat = ensureTeamRoom(iAmAdmin() ? 'owner' : VXC.uid), added = false;
      snap.docChanges().forEach(function(ch){
        if (ch.type !== 'added') return;
        var d = ch.doc.data() || {};
        if (chat.messages.some(function(m){ return m.id === d.id; })) return;
        chat.messages.push({ id:d.id, senderId:d.senderId, senderName:d.senderName, text:d.text, time:d.time, ts:d.ts });
        added = true;
      });
      if (added) {
        chat.messages.sort(function(a, b){ return (a.ts || 0) - (b.ts || 0); });
        saveDB();
        if (curChatId() === 'team-room') window.renderChatRoom('team-room');
      }
    }, function(e){ console.warn('team messages listener', e); tmOff = null; tmUid = null; });
  }

  var _scm = window.sendChatMessage;
  window.sendChatMessage = function(chatId){
    var chat = db.chats.find(function(c){ return c.id === chatId; });
    var before = chat ? chat.messages.length : 0;
    var r = _scm.apply(this, arguments);
    try {
      if (chatId === 'team-room' && cloud() && chat && chat.messages.length > before) {
        var m = chat.messages[chat.messages.length - 1];
        m.ts = Date.now(); saveDB();
        VXC.fs.collection('teamMessages').doc(m.id).set({ id:m.id, senderId:m.senderId, senderName:m.senderName, text:m.text, time:m.time, ts:m.ts })
          .catch(function(e){ console.warn(e); toast('Could not send to the team. Check the Firestore rules.', 'err'); });
      }
    } catch (e) {}
    return r;
  };

  setInterval(function(){
    try {
      if (!cloud()) return;
      if (iAmAdmin()) { startAdm(); startTeamMsgs(); } else startOwn();
    } catch (e) {}
  }, 3000);

  /* =====================  5. SEARCH PAGE  ===================== */
  var STOP = ('a an the in for with my i can where to of and or at on near me we our us spend go visit places place looking want need find best good nice some any ' +
    'bedroom bedrooms bed beds br bd please show get have has is are').split(' ');
  var NUMW = { one:1, two:2, three:3, four:4, five:5, six:6, seven:7, eight:8 };
  var FAM = 'entertainment entertaining leisure fun family resort hotel park club lounge cinema beach restaurant garden pool recreation amusement attraction event'.split(' ');
  var SYN = [
    ['flat','flats','apartment','apartments','condo','studio','unit','maisonette'],
    ['house','houses','home','homes','duplex','bungalow','villa','mansion','detached','terrace'],
    ['land','plot','plots','acre','acres','parcel'],
    ['estate','estates','gated','community','development'],
    ['company','companies','business','businesses','office','shop','commercial','firm'],
    ['rent','rental','rented','lease'],
    ['sale','buy','buying','purchase','sell']
  ];
  var CATX = { building:' house home flat apartment building property residential ', land:' land plot property ', estate:' estate gated community property ', company:' company business commercial ' };

  function expand(tok){
    if (FAM.indexOf(tok) > -1) return FAM;
    for (var i = 0; i < SYN.length; i++) if (SYN[i].indexOf(tok) > -1) return SYN[i];
    var out = [tok];
    if (tok.length > 3 && /s$/.test(tok)) out.push(tok.slice(0, -1));
    return out;
  }
  function hayOf(l){
    var d = l.details || {};
    return (String(l.title || '') + ' ' + (l.description || '') + ' ' + (l.state || '') + ' ' + (l.lga || '') + ' ' + (l.address || '') + ' ' +
      (l.category || '') + ' ' + catLabel(l.category) + ' for ' + (l.purpose || '') + ' ' +
      Object.keys(d).concat(Object.keys(d).map(function(k){ return d[k]; })).join(' ') + (CATX[l.category] || '')).toLowerCase();
  }
  function bedsOf(l){
    var d = l.details || {};
    if (d.Bedrooms) { var n = parseInt(d.Bedrooms, 10); if (!isNaN(n)) return n; }
    var m = /(\d+)\s*[- ]?\s*(?:bed|br\b|bd\b)/i.exec((l.title || '') + ' ' + (l.description || ''));
    return m ? parseInt(m[1], 10) : null;
  }

  window.applyExploreFilters = function(){
    var g = function(id){ return document.getElementById(id); };
    if (!g('f-search')) return;
    var state = (g('f-state') || {}).value || '';
    var lga = ((g('f-lga') || {}).value || '').toLowerCase().trim();
    var minPrice = parseFloat((g('f-min-price') || {}).value) || 0;
    var maxPrice = parseFloat((g('f-max-price') || {}).value) || Infinity;
    var dateVal = (g('f-date') || {}).value || '';
    var q = g('f-search').value.toLowerCase().replace(/[-,.?!]/g, ' ').replace(/\s+/g, ' ').trim();

    var items = db.listings.filter(function(l){ return l.status === 'active'; });
    if (state) items = items.filter(function(l){ return String(l.state || '').toLowerCase() === state.toLowerCase() || String(l.state || '').toLowerCase().indexOf(state.toLowerCase()) > -1; });
    if (lga) items = items.filter(function(l){ return (l.lga || '').toLowerCase().indexOf(lga) > -1; });
    items = items.filter(function(l){ return l.price >= minPrice && l.price <= maxPrice; });
    if (dateVal) {
      var cut = new Date(); cut.setDate(cut.getDate() - Number(dateVal));
      items = items.filter(function(l){ return new Date(l.createdAt) >= cut; });
    }

    var note = '';
    if (q) {
      var bedN = null;
      var bm = /(\d+|one|two|three|four|five|six|seven|eight)\s*(?:bed|beds|bedroom|bedrooms|br|bd)\b/.exec(q);
      if (bm) { bedN = NUMW[bm[1]] || parseInt(bm[1], 10); q = q.replace(bm[0], ' '); }
      var toks = q.split(' ').filter(function(t){ return t && STOP.indexOf(t) < 0; });
      var need = toks.length + (bedN !== null ? 1 : 0);
      if (need) {
        var scored = items.map(function(l){
          var h = hayOf(l), s = 0;
          toks.forEach(function(t){ if (expand(t).some(function(w){ return h.indexOf(w) > -1; })) s++; });
          if (bedN !== null && bedsOf(l) === bedN) s++;
          return { l:l, s:s };
        });
        var full = scored.filter(function(x){ return x.s === need; });
        if (full.length) items = full.map(function(x){ return x.l; });
        else {
          var part = scored.filter(function(x){ return x.s > 0; }).sort(function(a, b){ return b.s - a.s; });
          items = part.map(function(x){ return x.l; });
          if (items.length) note = '<p style="grid-column:1/-1;color:var(--ink3);font-size:13px;">No exact match. Showing the closest results.</p>';
        }
      }
    }

    var box = g('explore-results');
    if (!box) return;
    box.innerHTML = items.length ? note + items.map(function(l){ return listingCard(l, false); }).join('') : (
      '<div class="empty" style="grid-column:1/-1;"><div class="big">🔍</div><h3>Nothing matches your search yet</h3>' +
      '<p>Try fewer words, like "flat", "land" or "estate".</p></div>');
  };

  window.vxQuick = function(t){
    var i = document.getElementById('f-search');
    if (!i) return;
    i.value = t;
    window.applyExploreFilters();
  };

  var _re = window.renderExplore;
  window.renderExplore = function(){
    var r = _re.apply(this, arguments);
    try {
      var i = document.getElementById('f-search');
      if (i) {
        i.placeholder = 'Try: 2 bedroom flat, land in Lekki, family fun…';
        i.setAttribute('inputmode', 'search'); i.setAttribute('enterkeyhint', 'search');
        i.setAttribute('autocomplete', 'off'); i.setAttribute('type', 'search');
        i.setAttribute('onkeydown', "if(event.key==='Enter'){applyExploreFilters();this.blur();}");
      }
      var sb = document.querySelector('#app .searchbox');
      if (sb && !document.getElementById('vx-chips')) {
        var chips = ['2 bedroom flat', '3 bedroom flat', 'Land', 'Estates', 'Family entertainment', 'Companies'];
        sb.insertAdjacentHTML('afterend', '<div class="chips" id="vx-chips">' + chips.map(function(c){
          return '<button type="button" class="chip" onclick="vxQuick(\'' + c + '\')">' + c + '</button>';
        }).join('') + '</div>');
      }
    } catch (e) { console.warn('explore', e); }
    return r;
  };
})();
</script>

<style>
.vx-rm{margin-top:10px;padding:9px 14px;background:var(--red);color:#fff;border-radius:8px;font-weight:700;font-size:13px}

<script>
(function(){
  'use strict';

  function cloud(){ return !!(window.VXC && VXC.on && VXC.fs && VXC.uid); }
  function iAmAdmin(){ if (window.VXC && VXC.on) return !!VXC.admin; var u = me(); return !!u && u.id === 'owner'; }

  /* =====================  1. REMOVE ACCOUNTS  ===================== */
  function wipeLocal(id){
    db.users = db.users.filter(function(u){ return u.id !== id; });
    db.listings = db.listings.filter(function(l){ return l.sellerId !== id; });
    db.saved = (db.saved || []).filter(function(s){ return s.userId !== id; });
    db.inspections = (db.inspections || []).filter(function(i){ return i.buyerId !== id; });
    if (db.likes) db.likes = db.likes.filter(function(x){ return x.userId !== id; });
    if (db.follows) db.follows = db.follows.filter(function(f){ return f.followerId !== id && f.sellerId !== id; });
    if (db.teamRequests) db.teamRequests = db.teamRequests.filter(function(r){ return r.id !== id; });
    (db.chats || []).forEach(function(c){ c.members = (c.members || []).filter(function(x){ return x !== id; }); });
  }

  window.vxRemoveUser = async function(id){
    if (!iAmAdmin()) { toast('Not allowed', 'err'); return; }
    var u = db.users.find(function(x){ return x.id === id; });
    if (!u || id === 'owner') return;
    var nm = u.name || 'this account';
    if (!confirm('Remove ' + nm + '?\n\nTheir profile, documents and listings will be deleted and they will be blocked from signing in. This cannot be undone.')) return;

    var listingIds = db.listings.filter(function(l){ return l.sellerId === id; }).map(function(l){ return l.id; });

    if (cloud()) {
      var fs = VXC.fs;
      try {
        /* block first, so they are signed out even if a delete below is slow */
        await fs.collection('banned').doc(id).set({ uid:id, name:u.name || '', email:u.email || '', at:Date.now() });
        var tasks = [];
        ['users', 'profiles', 'kyc', 'teamRequests'].forEach(function(c){
          tasks.push(fs.collection(c).doc(id).delete().catch(function(){}));
        });
        tasks.push(fs.collection('lives').doc(id).delete().catch(function(){}));
        listingIds.forEach(function(lid){ tasks.push(fs.collection('listings').doc(lid).delete().catch(function(){})); });
        var snap = await fs.collection('listingImages').where('sellerId', '==', id).get();
        snap.forEach(function(d){ tasks.push(d.ref.delete().catch(function(){})); });
        await Promise.all(tasks);
      } catch (e) {
        console.warn('remove account', e);
        toast('Could not remove. Make sure the new Firestore rules are published.', 'err');
        return;
      }
    }

    wipeLocal(id);
    saveDB();
    toast('Removed: ' + nm, 'ok');
    if ((location.hash || '') === '#/admin') window.renderAdminDash();
  };

  function addButtons(){
    document.querySelectorAll('#vx-allusers .vx-urow').forEach(function(row){
      if (row.querySelector('.vx-rm')) return;
      var emailEl = row.children[1];
      var em = emailEl ? emailEl.textContent.trim().toLowerCase() : '';
      if (!em || em === '—') return;
      var u = db.users.find(function(x){ return x.id !== 'owner' && String(x.email || '').toLowerCase() === em; });
      if (!u) return;
      var b = document.createElement('button');
      b.className = 'vx-rm'; b.type = 'button'; b.textContent = '🗑️ Remove account';
      b.onclick = function(){ window.vxRemoveUser(u.id); };
      row.appendChild(b);
    });
  }

  var _rad = window.renderAdminDash;
  window.renderAdminDash = function(){
    var r = _rad.apply(this, arguments);
    try { if (iAmAdmin() && (location.hash || '') === '#/admin') addButtons(); }
    catch (e) { console.warn('remove buttons', e); }
    return r;
  };

  /* A removed person is signed out the moment they are blocked (or if they try to sign in again) */
  var banUid = null, banOff = null, kicked = false;
  function kickOut(){
    if (kicked) return;
    kicked = true;
    try { VXC.auth.signOut(); } catch (e) {}
    alert('This account has been removed by the admin.');
    location.hash = '#/';
    setTimeout(function(){ kicked = false; }, 3000);
  }
  setInterval(function(){
    try {
      if (!cloud() || iAmAdmin() || banUid === VXC.uid) return;
      banUid = VXC.uid;
      if (banOff) { try { banOff(); } catch (e) {} }
      banOff = VXC.fs.collection('banned').doc(VXC.uid).onSnapshot(function(s){
        if (s.exists) kickOut();
      }, function(){ banUid = null; });
    } catch (e) {}
  }, 2000);

  /* =====================  2. TEAM ROOM IS PRIVATE  ===================== */
  var _rr = window.renderChatRoom;
  window.renderChatRoom = function(id){
    if (id === 'team-room') {
      var u = me();
      var t = db.chats.find(function(c){ return c.id === 'team-room'; });
      var ok = !!u && (iAmAdmin() || (t && (t.members || []).indexOf(u.id) > -1));
      if (!ok) { toast('This room is private', 'err'); location.hash = '#/chats'; return; }
    }
    return _rr.apply(this, arguments);
  };
})();
</script>

<style>

<script>
(function(){
  'use strict';

  /* ====== FREE BIG-FILE UPLOADS (Cloudinary, no card needed) ======
     Paste your two values between the quotes. Leave empty to skip. */
  var CLOUDINARY_CLOUD  = 'ifdzaobf';   /* your Cloudinary "Cloud name" */
  var CLOUDINARY_PRESET = 'veritas';   /* your UNSIGNED upload preset name */
  window.vxCloud = { cloud: CLOUDINARY_CLOUD, preset: CLOUDINARY_PRESET };
  var SDK_ST = 'https://www.gstatic.com/firebasejs/10.12.2/firebase-storage-compat.js';
  var INLINE_MAX = 600000;      /* biggest file saved inside the message itself (if Storage is off) */

  function cloud(){ return !!(window.VXC && VXC.on && VXC.fs && VXC.uid); }
  function iAmAdmin(){ return !!(window.VXC && VXC.on && VXC.admin); }
  /* the admin is called "owner" on this phone, but has a real Firebase id online */
  function toCid(x){ return (x === 'owner' && window.VXC && VXC.admin) ? VXC.uid : x; }
  function fromCid(x){ return (window.VXC && VXC.admin && x === VXC.uid) ? 'owner' : x; }
  function slug(s){ return String(s || '').toLowerCase().trim().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, ''); }
  function curChatId(){ var m = /^#\/chats\/([^/?]+)/.exec(location.hash || ''); return m ? m[1] : null; }
  function chatById(id){ return (db.chats || []).find(function(c){ return c.id === id; }); }
  function keyOf(m){ return toCid(m.senderId) + '_' + m.id; }
  function byTs(a, b){ return (a.ts || 0) - (b.ts || 0); }
  function union(arr){ return firebase.firestore.FieldValue.arrayUnion.apply(null, arr); }
  function toDataUrl(b){
    return new Promise(function(res, rej){ var r = new FileReader(); r.onload = function(){ res(r.result); }; r.onerror = function(){ rej(r.error); }; r.readAsDataURL(b); });
  }

  /* ---------- media storage on this phone (same store the chat upgrade uses) ---------- */
  function idb(){
    return new Promise(function(res, rej){
      var r = indexedDB.open('veritas_media', 1);
      r.onupgradeneeded = function(){ if (!r.result.objectStoreNames.contains('m')) r.result.createObjectStore('m'); };
      r.onsuccess = function(){ res(r.result); };
      r.onerror = function(){ rej(r.error); };
    });
  }
  async function putBlob(id, blob){
    var d = await idb();
    return new Promise(function(res, rej){
      var t = d.transaction('m', 'readwrite'); t.objectStore('m').put(blob, id);
      t.oncomplete = function(){ res(); }; t.onerror = function(){ rej(t.error); };
    });
  }
  async function getBlob(id){
    var d = await idb();
    return new Promise(function(res, rej){
      var q = d.transaction('m').objectStore('m').get(id);
      q.onsuccess = function(){ res(q.result); }; q.onerror = function(){ rej(q.error); };
    });
  }

  /* ---------- Firebase Storage (for voice notes, photos, videos) ---------- */
  var stLoad = null, warnedStorage = false;
  function loadStorage(){
    if (window.firebase && firebase.storage) return Promise.resolve(true);
    if (stLoad) return stLoad;
    stLoad = new Promise(function(res){
      var s = document.createElement('script');
      s.src = SDK_ST; s.onload = function(){ res(!!(window.firebase && firebase.storage)); }; s.onerror = function(){ res(false); };
      document.head.appendChild(s);
    });
    return stLoad;
  }
  async function uploadCloudinary(blob){
    if (!CLOUDINARY_CLOUD || !CLOUDINARY_PRESET) return null;
    try {
      var fd = new FormData();
      var ext = ((blob.type || '').split('/')[1] || 'bin').split(';')[0].replace(/[^a-z0-9]/gi, '').slice(0, 5) || 'bin';
      var nm = 'vx_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2, 10) + '.' + ext;
      fd.append('file', blob, nm);
      fd.append('upload_preset', CLOUDINARY_PRESET);
      var r = await fetch('https://api.cloudinary.com/v1_1/' + encodeURIComponent(CLOUDINARY_CLOUD) + '/auto/upload', { method:'POST', body:fd });
      var j = await r.json();
      if (j && j.secure_url) return j.secure_url;
      console.warn('cloudinary', j);
    } catch (e) { console.warn('cloudinary upload', e); }
    return null;
  }
  async function uploadBlob(blob){
    var cu = await uploadCloudinary(blob);
    if (cu) return cu;
    if (await loadStorage()) {
      try {
        var ref = firebase.storage().ref('chatMedia/' + VXC.uid + '/' + Date.now() + '_' + Math.random().toString(36).slice(2, 8));
        await ref.put(blob, { contentType: blob.type || 'application/octet-stream' });
        return await ref.getDownloadURL();
      } catch (e) { console.warn('storage upload', e); }
    }
    if (blob.size <= INLINE_MAX) return await toDataUrl(blob);
    if (!warnedStorage) { warnedStorage = true; toast('Big photos and videos need Cloudinary (or Firebase Storage) set up.', 'err'); }
    return null;
  }

  async function mediaForCloud(m){
    var md = m.media;
    if (md.cloudUrl) return { kind:md.kind, mime:md.mime || '', dur:md.dur || 0, url:md.cloudUrl };
    if (md.url) return { kind:md.kind, mime:md.mime || '', dur:md.dur || 0, url:md.url };
    if (!md.id) return null;
    var blob = await getBlob(md.id);
    if (!blob) return null;
    var url = await uploadBlob(blob);
    if (!url) return null;
    if (url.indexOf('data:') !== 0) md.cloudUrl = url;
    return { kind:md.kind, mime:md.mime || blob.type || '', dur:md.dur || 0, url:url };
  }
  async function mediaFromCloud(md){
    if (md.url && md.url.indexOf('data:') === 0) {
      try {
        var blob = await (await fetch(md.url)).blob();
        var id = 'rx' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
        await putBlob(id, blob);
        return { id:id, kind:md.kind, mime:md.mime || blob.type, dur:md.dur || 0 };
      } catch (e) { return { kind:md.kind, mime:md.mime || '', dur:md.dur || 0, url:md.url }; }
    }
    return { kind:md.kind, mime:md.mime || '', dur:md.dur || 0, url:md.url };
  }

  /* =====================  KEEP CHAT IDS THE SAME ON EVERY PHONE  ===================== */
  function canon(){
    (db.chats || []).slice().forEach(function(c){
      if (!c || c.id === 'team-room' || c.id === 'community') return;
      var nid = null;
      if (c.type === 'dm') {
        var ids = (c.members || []).map(toCid);
        if (ids.length === 2) nid = 'dm_' + ids.slice().sort().join('_');
      } else if (!c.type && c.lga) {
        var cc = c.country || (window.VX ? VX.country : 'NG');
        c.country = cc;
        nid = 'lga_' + cc + '_' + slug(c.lga);
      }
      if (!nid || nid === c.id) return;
      var ex = db.chats.find(function(x){ return x !== c && x.id === nid; });
      var old = c.id;
      if (ex) {
        (c.members || []).forEach(function(m){ if (ex.members.indexOf(m) < 0) ex.members.push(m); });
        var have = {}; ex.messages.forEach(function(m){ have[keyOf(m)] = 1; });
        c.messages.forEach(function(m){ if (!have[keyOf(m)]) ex.messages.push(m); });
        ex.messages.sort(byTs);
        db.chats.splice(db.chats.indexOf(c), 1);
      } else c.id = nid;
      if ((location.hash || '') === '#/chats/' + old) {
        try { history.replaceState(null, '', '#/chats/' + nid); } catch (e) {}
        setTimeout(function(){ try { router(); } catch (e) {} }, 0);
      }
    });
  }
  function stamp(){
    (db.chats || []).forEach(function(c){
      if (c.id === 'team-room') return;
      (c.messages || []).forEach(function(m){ if (!m.ts) m.ts = Date.now(); });
    });
  }

  /* personal chat: same id for both people */
  var _opc = window.openPersonalChat;
  window.openPersonalChat = function(sellerId){
    if (!cloud()) return _opc.apply(this, arguments);
    var u = me();
    if (!u) { location.hash = '#/auth'; return; }
    if (u.id === sellerId) { toast('This is your own post'); return; }
    var id = 'dm_' + [toCid(u.id), toCid(sellerId)].sort().join('_');
    var chat = chatById(id);
    if (!chat) {
      chat = { id:id, type:'dm', lga:'', members:[u.id, sellerId], messages:[] };
      db.chats.push(chat); saveDB();
    }
    location.hash = '#/chats/' + id;
  };

  /* LGA / city chat: same id for everyone in that place */
  var _vja = window.vxJoinArea;
  window.vxJoinArea = function(nameArg){
    if (!cloud()) return _vja.apply(this, arguments);
    var u = me(); if (!u) return;
    var el = document.getElementById('vx-area-in');
    var name = String(nameArg || (el && el.value) || '').trim().replace(/\s+/g, ' ');
    if (!name) return toast('Type your area', 'err');
    var cc = window.VX ? VX.country : 'NG';
    var id = 'lga_' + cc + '_' + slug(name);
    var chat = chatById(id);
    if (!chat) { chat = { id:id, lga:name, country:cc, members:[], messages:[] }; db.chats.push(chat); }
    if (chat.members.indexOf(u.id) < 0) chat.members.push(u.id);
    saveDB(); toast('Joined ' + chat.lga, 'ok');
    location.hash = '#/chats/' + chat.id;
  };

  /* =====================  SEND TO THE CLOUD  ===================== */
  var sigs = {}, busy = false, again = false, inSync = false, tmr = null, failedOnce = false;

  function flush(){ inSync = true; try { window.saveDB(); } finally { inSync = false; } }

  async function ensureChatDoc(c, ids){
    var ref = VXC.fs.collection('chats').doc(c.id), snap;
    try { snap = await ref.get(); } catch (e) { console.warn('chat read', e); return false; }
    try {
      if (!snap.exists) {
        await ref.set({ id:c.id, type:c.type || null, name:c.name || '', lga:c.lga || '', country:c.country || '',
          open: !!(c.open || (!c.type && c.lga) || c.id === 'community'),
          createdBy:VXC.uid, createdAt:Date.now(), members:ids });
      } else {
        await ref.update({ members: union(ids) });
      }
      return true;
    } catch (e) { console.warn('chat write', e); return false; }
  }

  async function syncUp(){
    if (!cloud()) return;
    if (busy) { again = true; return; }
    busy = true;
    var changed = false;
    try {
      var me0 = VXC.uid;
      var list = (db.chats || []).slice();
      for (var i = 0; i < list.length; i++) {
        var c = list[i];
        if (!c || c.id === 'team-room') continue;
        var ids = (c.members || []).map(toCid);
        if (ids.indexOf(me0) < 0) continue;
        var sig = ids.slice().sort().join(',');
        if (sigs[c.id] !== sig) {
          var ok = await ensureChatDoc(c, ids);
          if (!ok) continue;
          sigs[c.id] = sig;
        }
        var msgs = (c.messages || []).slice();
        for (var j = 0; j < msgs.length; j++) {
          var m = msgs[j];
          if (m.synced) continue;
          if (m.senderId === 'system' || toCid(m.senderId) !== me0) { m.synced = true; changed = true; continue; }
          var media = null;
          if (m.media) {
            try { media = await mediaForCloud(m); } catch (e) { console.warn('media', e); media = null; }
            if (!media) { m.synced = 'fail'; changed = true; continue; }
          }
          try {
            await VXC.fs.collection('chats').doc(c.id).collection('messages').doc(me0 + '_' + m.id).set({
              id:m.id, senderId:me0, senderName:m.senderName || '', text:m.text || '', time:m.time || '', ts:m.ts || Date.now(), media:media
            });
            m.synced = true; changed = true;
          } catch (e) {
            console.warn('send message', e);
            if (!failedOnce) { failedOnce = true; toast('Message could not be sent online. Check the Firestore rules.', 'err'); }
          }
        }
      }
    } finally {
      busy = false;
      if (changed) flush();
      if (again) { again = false; setTimeout(syncUp, 300); }
    }
  }

  var _sv = window.saveDB;
  window.saveDB = function(){
    try { if (cloud() && !inSync) { canon(); stamp(); } } catch (e) { console.warn('chat prep', e); }
    var r = _sv.apply(this, arguments);
    if (cloud() && !inSync) { clearTimeout(tmr); tmr = setTimeout(syncUp, 400); }
    return r;
  };

  /* =====================  RECEIVE FROM THE CLOUD  ===================== */
  var lsUid = null, offs = [], msgOffs = {}, dirtyRoom = {}, dirtyList = false, lastUid = null;

  function stopListeners(){
    offs.forEach(function(f){ try { f(); } catch (e) {} }); offs = [];
    Object.keys(msgOffs).forEach(function(k){ try { msgOffs[k](); } catch (e) {} }); msgOffs = {};
    lsUid = null;
  }

  function markDirty(id){ dirtyRoom[id] = 1; dirtyList = true; }

  async function handleMsgs(id, snap){
    var c = chatById(id); if (!c) return;
    var docs = snap.docChanges().filter(function(ch){ return ch.type === 'added'; });
    var added = false;
    for (var i = 0; i < docs.length; i++) {
      var d = docs[i].doc.data() || {};
      var k = d.senderId + '_' + d.id;
      if (c.messages.some(function(x){ return keyOf(x) === k; })) continue;
      var m = { id:d.id, senderId:fromCid(d.senderId), senderName:d.senderName || '', text:d.text || '', time:d.time || '', ts:d.ts || 0, synced:true };
      if (d.media) { try { m.media = await mediaFromCloud(d.media); } catch (e) { continue; } }
      if (c.messages.some(function(x){ return keyOf(x) === k; })) continue;
      c.messages.push(m); added = true;
    }
    if (added) { c.messages.sort(byTs); flush(); markDirty(id); }
  }

  function startMsgs(id){
    if (msgOffs[id]) return;
    msgOffs[id] = VXC.fs.collection('chats').doc(id).collection('messages').orderBy('ts').limitToLast(200).onSnapshot(
      function(snap){ handleMsgs(id, snap); },
      function(e){ console.warn('messages listener', id, e); delete msgOffs[id]; });
  }

  function onChats(snap){
    var touched = false;
    snap.docChanges().forEach(function(ch){
      if (ch.type === 'removed') return;
      var d = ch.doc.data() || {};
      if (!d.id) return;
      var ids = (d.members || []).map(fromCid);
      var c = chatById(d.id);
      if (!c) {
        c = { id:d.id, lga:d.lga || '', members:ids.slice(), messages:[] };
        if (d.type) c.type = d.type;
        if (d.name) c.name = d.name;
        if (d.country) c.country = d.country;
        if (d.open) c.open = true;
        if (d.createdBy) c.createdBy = d.createdBy;
        db.chats.push(c); touched = true;
      } else {
        ids.forEach(function(m){ if (c.members.indexOf(m) < 0) { c.members.push(m); touched = true; } });
        if (d.name && !c.name) { c.name = d.name; touched = true; }
        if (d.open && !c.open) { c.open = true; touched = true; }
        if (d.type && !c.type) { c.type = d.type; touched = true; }
      }
      if ((d.members || []).indexOf(VXC.uid) > -1) startMsgs(d.id);
    });
    if (touched) { flush(); dirtyList = true; }
  }

  function startListeners(){
    if (!cloud() || lsUid === VXC.uid) return;
    stopListeners();
    lsUid = VXC.uid; lastUid = VXC.uid;
    var fs = VXC.fs;
    function err(e){ console.warn('chats listener', e); lsUid = null; }
    offs.push(fs.collection('chats').where('members', 'array-contains', VXC.uid).onSnapshot(onChats, err));
    offs.push(fs.collection('chats').where('open', '==', true).where('type', '==', 'group').onSnapshot(onChats, err));
  }

  /* redraw the open chat (keeps what you are typing; waits while you record or pick emojis) */
  function soft(id){
    var inp = document.getElementById('chat-input');
    var val = inp ? inp.value : '', had = !!inp && document.activeElement === inp;
    window.renderChatRoom(id);
    var n = document.getElementById('chat-input');
    if (n) { n.value = val; if (had) n.focus(); }
  }

  setInterval(function(){
    try {
      if (window.VXC && VXC.on && !VXC.uid && lastUid) {        /* signed out: clear this phone's chats */
        stopListeners();
        db.chats = (db.chats || []).filter(function(c){ return c.id === 'team-room'; });
        sigs = {}; lastUid = null; flush();
        return;
      }
      if (cloud()) startListeners();
    } catch (e) { console.warn(e); }
  }, 2000);

  setInterval(function(){
    try {
      var cur = curChatId();
      if (cur && dirtyRoom[cur]) {
        var area = document.querySelector('.chat-input-area');
        var rec = area && area.classList.contains('vx-rec');
        var tray = document.getElementById('vx-tray');
        if (!rec && !tray) { delete dirtyRoom[cur]; soft(cur); }
      }
      if (/^#\/chats\/?$/.test(location.hash || '') && dirtyList) {
        var a = document.activeElement;
        if (!(a && /^(INPUT|TEXTAREA)$/.test(a.tagName))) { dirtyList = false; window.renderChatList(); }
      }
    } catch (e) { console.warn(e); }
  }, 900);

  /* =====================  LIVE COMMENTS  ===================== */
  var lc = null, curWatch = null;

  var _watch = window.vxWatchLive;
  if (typeof _watch === 'function') {
    window.vxWatchLive = function(hostId){ curWatch = hostId; return _watch.apply(this, arguments); };
  }

  function unmountComments(){
    if (!lc) return;
    var o = lc; lc = null;
    try { o.unsub && o.unsub(); } catch (e) {}
    if (o.panel && o.panel.parentNode) o.panel.remove();
    if (o.isHost && cloud()) {          /* the host's live ended: clear its comments */
      VXC.fs.collection('lives').doc(o.host).collection('comments').get().then(function(s){
        s.forEach(function(d){ d.ref.delete().catch(function(){}); });
      }).catch(function(){});
    }
  }

  function mountComments(root, hostId, isHost){
    if (lc && lc.root === root && lc.host === hostId) return;
    unmountComments();
    var panel = document.createElement('div');
    panel.id = 'vx-lc';
    var ctl = root.querySelector('.live-controls');
    panel.style.bottom = ctl ? (ctl.offsetHeight + 6) + 'px' : 'max(10px, env(safe-area-inset-bottom))';
    panel.innerHTML = '<div class="list"></div><div class="row"><input maxlength="200" placeholder="Add a comment…" autocomplete="off"><button type="button">Post</button></div>';
    root.appendChild(panel);
    var list = panel.querySelector('.list'), input = panel.querySelector('input'), btn = panel.querySelector('button');
    var o = lc = { root:root, host:hostId, isHost:isHost, panel:panel, unsub:null, last:0, seen:{} };

    function add(d){
      var el = document.createElement('div'); el.className = 'c';
      var b = document.createElement('b'); b.textContent = d.name || 'Guest';
      el.appendChild(b); el.appendChild(document.createTextNode(d.text || ''));
      list.appendChild(el);
      while (list.children.length > 40) list.removeChild(list.firstChild);
      list.scrollTop = list.scrollHeight;
    }
    function post(){
      var v = input.value.trim().slice(0, 200);
      if (!v || !cloud()) return;
      if (Date.now() - o.last < 1000) return;
      o.last = Date.now(); input.value = '';
      var u = me();
      VXC.fs.collection('lives').doc(hostId).collection('comments').add({ uid:VXC.uid, name:u ? u.name : 'Guest', text:v, ts:Date.now() })
        .catch(function(e){ console.warn('comment', e); toast('Could not post the comment.', 'err'); });
    }
    btn.onclick = post;
    input.onkeydown = function(e){ if (e.key === 'Enter') post(); };
    o.unsub = VXC.fs.collection('lives').doc(hostId).collection('comments').orderBy('ts').limitToLast(40).onSnapshot(function(snap){
      snap.docChanges().forEach(function(ch){
        if (ch.type !== 'added' || o.seen[ch.doc.id]) return;
        o.seen[ch.doc.id] = 1; add(ch.doc.data() || {});
      });
    }, function(e){ console.warn('comments listener', e); });
  }

  setInterval(function(){
    try {
      var hostUi = document.getElementById('live-ui'), viewUi = document.getElementById('vx-live-view');
      var broadcasting = typeof liveStream !== 'undefined' && !!liveStream;
      if (cloud() && hostUi && broadcasting) mountComments(hostUi, VXC.uid, true);
      else if (cloud() && viewUi && curWatch) mountComments(viewUi, curWatch, false);
      else unmountComments();
    } catch (e) { console.warn('live comments', e); }
  }, 600);
})();
</script>

.vx-rw{border:1px solid var(--line);border-radius:14px;padding:14px;margin:6px 0 18px;background:var(--surface)}
.vx-rw .t{font-weight:800;font-size:15px;display:flex;align-items:center;gap:6px}
.vx-rw .big{font-size:26px;font-weight:800;margin:6px 0 2px;display:flex;align-items:center;gap:8px}
.vx-rw .sub{font-size:12px;color:var(--ink3);margin-bottom:10px}
.vx-goal{margin:8px 0}
.vx-goal .r{display:flex;justify-content:space-between;font-size:12px;color:var(--ink2)}
.vx-goal .bar{height:6px;border-radius:99px;background:var(--line);overflow:hidden;margin-top:4px}
.vx-goal .bar i{display:block;height:100%;background:linear-gradient(90deg,#c9a227,#e11d48)}
.vx-rw .note{font-size:11px;color:var(--ink3);margin-top:8px}
.vx-crown{display:inline-block;background:linear-gradient(135deg,#c9a227,#e11d48);color:#fff;font-weight:800;font-size:12px;padding:5px 12px;border-radius:99px;margin:4px 0 12px}

/* ---------- hearts ---------- */
.vs-btn{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
.vs-btn.vx-holding .vs-circle{animation:vxhold 2s linear forwards}
@keyframes vxhold{0%{transform:scale(1);box-shadow:0 0 0 0 rgba(225,29,72,.55)}100%{transform:scale(1.4);box-shadow:0 0 0 16px rgba(225,29,72,0)}}
.vx-hs{width:22px;height:26px;display:block;margin:auto}
.vx-hn{display:flex;align-items:center;justify-content:center;gap:3px;font-size:11px;margin-top:2px}
.vx-hn svg{width:11px;height:13px}
.vx-heartfx{position:fixed;inset:0;z-index:99990;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(0,0,0,.4);pointer-events:none;animation:vxfxbg 2s ease forwards}
.vx-heartfx svg{width:150px;height:180px;filter:drop-shadow(0 10px 26px rgba(220,20,40,.75));animation:vxbeat .62s ease-in-out 3}
.vx-heartfx b{color:#fff;font-size:20px;margin-top:10px;text-shadow:0 2px 8px #000}
@keyframes vxbeat{0%,100%{transform:scale(1)}30%{transform:scale(1.2)}60%{transform:scale(.97)}}
@keyframes vxfxbg{0%{opacity:0}12%{opacity:1}82%{opacity:1}100%{opacity:0}}

/* ---------- video upload overlay ---------- */
#vx-upl{position:fixed;inset:0;z-index:99996;background:rgba(8,20,14,.92);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px}
#vx-upl .bar{width:min(320px,80vw);height:10px;border-radius:99px;background:rgba(255,255,255,.2);overflow:hidden;margin:14px 0 8px}
#vx-upl .bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#c9a227,#0e7a4f)}

/* ---------- embedded video links on Home ---------- */
.vx-embed{background:#000;border:0}
.vx-linkcard{background:#000;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;padding:20px}
.vx-linkcard a{background:#0e7a4f;color:#fff;padding:12px 22px;border-radius:99px;font-weight:700;text-decoration:none}
</style>

      <linearGradient id="vxhg3" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#e0384a"/><stop offset="1" stop-color="#8a0b1b"/></linearGradient>

<script>
(function(){
  'use strict';

  var ADMIN = 'owner';
  var MAX_VIDEO = 90 * 1048576;
  var GOALS = { views:4000000000, followers:1000000, likes:50000000, comments:1000000, reposts:100 };
  function VN(){ return window.VXN && VXN.on(); }

  function isSeller(u){ return !!u && u.accountType === 'seller'; }
  function isAdminU(u){ return !!u && u.id === ADMIN; }
  function nf(n){ try { return Number(n).toLocaleString('en-US'); } catch (e) { return String(n); } }
  function ensure(){
    if (!db.hearts) db.hearts = [];
    if (!db.likes) db.likes = [];
    if (!db.follows) db.follows = [];
    if (!db.viewCount) db.viewCount = {};
    if (!db.shareCount) db.shareCount = {};
  }
  function H(w, h){ return '<svg class="vx-hs" style="width:' + w + 'px;height:' + h + 'px" viewBox="0 0 100 120"><use href="#vxHeart"/></svg>'; }

  /* =====================  2. BOTTOM BAR: "+"  ===================== */
  function fixNav(){
    var nav = document.querySelector('.bottom-nav'); if (!nav) return;
    var it = nav.querySelectorAll('.nav-item')[4];
    if (!it || it.classList.contains('vx-plus')) return;
    it.classList.add('vx-plus');
    it.setAttribute('onclick', "location.hash='#/post'");
    var ic = it.querySelector('.icon'); if (ic) ic.textContent = '+';
    Array.prototype.slice.call(it.childNodes).forEach(function(n){ if (n.nodeType === 3 && n.nodeValue.trim()) n.nodeValue = 'Post'; });
  }
  fixNav(); setInterval(fixNav, 2000);

  /* =====================  3. BUYER BY DEFAULT, NEPA ONLY FOR SELLERS  ===================== */
  var _kyc = window.renderKYCStep;
  if (typeof _kyc === 'function') window.renderKYCStep = function(){
    var u = me();
    if (u && !isAdminU(u) && u.accountType === 'buyer') { location.hash = '#/'; return; }
    return _kyc.apply(this, arguments);
  };
  var _pend = window.renderPendingScreen;
  if (typeof _pend === 'function') window.renderPendingScreen = function(){
    var u = me();
    if (u && !isAdminU(u) && u.accountType === 'buyer') { location.hash = '#/'; return; }
    return _pend.apply(this, arguments);
  };
  var _dash = window.renderDashboard;
  if (typeof _dash === 'function') window.renderDashboard = function(){
    var u = me();
    if (u && !isAdminU(u) && u.accountType === 'buyer' && u.kycStatus !== 'verified' && typeof renderBuyerDash === 'function') return renderBuyerDash(u);
    return _dash.apply(this, arguments);
  };

  function becomeSeller(u){
    u.accountType = 'seller';
    if (u.stars === undefined) u.stars = 3;
    if (!u.transactions) u.transactions = [];
    ensureAdminFollow();
    saveDB(); closeModal();
    if (u.kycStatus === 'verified') { toast('You are now a Seller.', 'ok'); location.hash = '#/dashboard'; }
    else { toast('Add your NEPA bill to finish becoming a seller.', 'ok'); location.hash = '#/auth/seller/kyc'; }
  }
  window.vxSwitchRole = function(){
    var u = me(); if (!u || isAdminU(u)) return;
    if (isSeller(u)) {
      u.accountType = 'buyer'; saveDB(); closeModal();
      toast('You are now a Buyer.', 'ok');
      location.hash = '#/';
      return;
    }
    if (u.phone && u.sellerType) return becomeSeller(u);
    $('#modal-root').innerHTML =
      '<div class="modal-bg vx-drawer" onclick="if(event.target===this)closeModal()"><div class="modal">' +
      '<h3>Become a seller</h3><p class="muted">Add your phone number, then verify with your NEPA bill so buyers can trust you.</p>' +
      '<label>Phone number</label><input id="vx-sw-phone" type="tel" placeholder="+234 ..." value="' + esc(u.phone || '') + '">' +
      '<label style="margin-top:12px">I am a...</label>' +
      '<select id="vx-sw-type"><option value="agent">Real Estate Agent</option><option value="owner">Direct Owner</option><option value="developer">Developer</option></select>' +
      '<button class="btn btn-primary btn-full" style="margin-top:18px" onclick="vxSwitchGo()">Continue</button></div></div>';
  };
  window.vxSwitchGo = function(){
    var u = me(); if (!u) return;
    var ph = ((document.getElementById('vx-sw-phone') || {}).value || '').trim();
    if (!ph) return toast('Enter your phone number', 'err');
    u.phone = ph;
    u.sellerType = (document.getElementById('vx-sw-type') || {}).value || 'owner';
    becomeSeller(u);
  };

  /* Settings: "Pay for stars" for sellers only */
  var _os = window.openSettings;
  window.openSettings = function(){
    var r = _os.apply(this, arguments);
    try {
      var u = me();
      if (isSeller(u) && !document.getElementById('vx-stars')) {
        var anchor = document.getElementById('vx-switch') || document.querySelector('#modal-root .set-item[onclick*="country"]');
        if (anchor) anchor.insertAdjacentHTML('beforebegin',
          '<button id="vx-stars" class="set-item gold" onclick="closeModal();openPaymentModal()"><span class="ico">⭐</span>Pay for stars' +
          '<span style="font-size:12px;font-weight:500;color:var(--ink3)">' + (u.stars !== undefined ? u.stars : 3) + ' left</span></button>');
      }
    } catch (e) { console.warn(e); }
    return r;
  };

  /* Post page: buyers are told to switch; sellers must finish the NEPA step first */
  function card(icon, title, text, btn, act){
    $('#app').innerHTML = '<div class="auth-wrap"><div class="auth-card" style="text-align:center"><div style="font-size:48px;margin-bottom:12px">' + icon + '</div><h2>' + title + '</h2>' +
      '<p class="muted">' + text + '</p>' + (btn ? '<button class="btn btn-gold btn-full" style="margin-top:12px" onclick="' + act + '">' + btn + '</button>' : '') + '</div></div>';
  }
  var _rp = window.renderPost;
  window.renderPost = function(){
    var u = me();
    if (u && !isAdminU(u) && !isSeller(u)) return card('🏷️', 'Become a seller to post', 'This is a buyer account. Switch to Seller in Settings, add your NEPA bill, and you can post properties.', 'Open Settings', 'openSettings()');
    if (isSeller(u) && u.kycStatus !== 'verified') {
      return u.kycStatus === 'pending_review'
        ? card('⏳', 'Waiting for approval', 'We are checking your NEPA bill. You can post as soon as the admin approves it.')
        : card('📄', 'Verify your NEPA bill first', 'Sellers must verify with a NEPA bill before posting.', 'Verify now', "location.hash='#/auth/seller/kyc'");
    }
    var r = _rp.apply(this, arguments);
    try { addVideoField(); } catch (e) { console.warn(e); }
    return r;
  };

  /* =====================  1. HOME VIDEO: UPLOAD (<= 90 MB) OR LINK  ===================== */
  function addVideoField(){
    var f = document.getElementById('p-images'); if (!f || document.getElementById('vx-vfield')) return;
    var fld = f.closest('.field'); if (!fld) return;
    fld.insertAdjacentHTML('afterend',
      '<div class="field" id="vx-vfield"><label>Property video (optional)</label>' +
      '<input type="file" id="vx-vfile" class="green-input" accept="video/*">' +
      '<div class="tiny-note">Upload a video up to 90 MB, or paste a link below. Bigger than 90 MB? Post it on YouTube, TikTok, Facebook or Vimeo and paste the link.</div>' +
      '<input id="vx-vlink" class="green-input" placeholder="Or paste a video link (https://…)" style="margin-top:8px">' +
      '<div id="vx-vmsg" class="tiny-note" style="display:none"></div></div>');
    document.getElementById('vx-vfile').onchange = function(){
      var file = this.files[0], m = document.getElementById('vx-vmsg');
      if (file && file.size > MAX_VIDEO) {
        this.value = '';
        m.style.display = 'block'; m.style.color = 'var(--red)';
        m.textContent = 'This video is bigger than 90 MB. Please post it on YouTube, TikTok, Facebook or Vimeo and paste the link below.';
        toast('Video is bigger than 90 MB. Paste a link instead.', 'err');
        var l = document.getElementById('vx-vlink'); if (l) l.focus();
      } else if (file) {
        m.style.display = 'block'; m.style.color = 'var(--green)';
        m.textContent = '✓ ' + file.name + ' (' + Math.max(1, Math.round(file.size / 1048576)) + ' MB) will upload when you submit.';
      } else m.style.display = 'none';
    };
  }

  function cleanLink(s){
    s = String(s || '').trim(); if (!s) return '';
    if (!/^https?:\/\//i.test(s)) s = 'https://' + s;
    try { var x = new URL(s); if (!/^https?:$/.test(x.protocol) || x.hostname.indexOf('.') < 0) return null; return x.href; } catch (e) { return null; }
  }

  function upload(file, onProg){
    return new Promise(function(res){
      var c = window.vxCloud || {};
      if (!c.cloud || !c.preset) return res(null);
      var ext = ((file.name || '').split('.').pop() || 'mp4').toLowerCase().replace(/[^a-z0-9]/g, '').slice(0, 5) || 'mp4';
      var nm = 'vx_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2, 9) + '.' + ext;
      var fd = new FormData(); fd.append('file', file, nm); fd.append('upload_preset', c.preset);
      var x = new XMLHttpRequest();
      x.open('POST', 'https://api.cloudinary.com/v1_1/' + encodeURIComponent(c.cloud) + '/video/upload');
      x.upload.onprogress = function(e){ if (e.lengthComputable && onProg) onProg(Math.round(e.loaded * 100 / e.total)); };
      x.onload = function(){
        try { var j = JSON.parse(x.responseText); res(j && j.secure_url ? String(j.secure_url).replace(/\.[a-z0-9]+$/i, '.mp4') : null); }
        catch (e) { res(null); }
      };
      x.onerror = function(){ res(null); };
      x.send(fd);
    });
  }

  function overlay(on, pct){
    var o = document.getElementById('vx-upl');
    if (!on) { if (o) o.remove(); return; }
    if (!o) {
      o = document.createElement('div'); o.id = 'vx-upl';
      o.innerHTML = '<div style="font-size:46px">🎬</div><h3 style="margin-top:8px">Uploading your video…</h3><div class="bar"><i></i></div><div class="p">0%</div><p style="opacity:.75;font-size:13px;margin-top:10px">Keep this page open until it finishes.</p>';
      document.body.appendChild(o);
    }
    o.querySelector('i').style.width = pct + '%'; o.querySelector('.p').textContent = pct + '%';
  }

  var _sub = window.submitListing;
  if (typeof _sub === 'function') window.submitListing = async function(){
    var fileEl = document.getElementById('vx-vfile'), linkEl = document.getElementById('vx-vlink');
    var file = fileEl && fileEl.files[0], rawLink = linkEl ? linkEl.value : '';
    var link = null;
    if (file && file.size > MAX_VIDEO) return toast('Video is bigger than 90 MB. Paste a link instead.', 'err');
    if (!file && rawLink.trim()) {
      link = cleanLink(rawLink);
      if (!link) return toast('That video link is not valid.', 'err');
    }
    if (file && (!window.vxCloud || !window.vxCloud.cloud)) return toast('Video upload is not set up. Paste a video link instead.', 'err');
    var before = (db.listings || []).length;
    var r = await _sub.apply(this, arguments);
    try {
      var u = me(), l = db.listings[0];
      if (u && l && db.listings.length > before && l.sellerId === u.id) {
        if (link) { l.video = link; saveDB(); }
        else if (file) {
          overlay(true, 0);
          var url = await upload(file, function(p){ overlay(true, p); });
          overlay(false);
          if (url) { l.video = url; saveDB(); toast('Video uploaded', 'ok'); }
          else toast('Video upload failed. Your property is posted without it.', 'err');
        }
      }
    } catch (e) { overlay(false); console.warn(e); }
    return r;
  };

  /* ----- play links from other apps inside the Home feed ----- */
  function yt(id){
    if (!id) return { t:'link' };
    id = String(id).replace(/[^\w-]/g, '').slice(0, 20);
    return { t:'embed', src:'https://www.youtube-nocookie.com/embed/' + id + '?autoplay=1&mute=1&loop=1&playlist=' + id + '&playsinline=1&rel=0' };
  }
  function parseVid(u){
    u = String(u || '').trim();
    if (/^(data|blob):/i.test(u)) return { t:'file' };
    var x; try { x = new URL(u); } catch (e) { return { t:'file' }; }
    var h = x.hostname.replace(/^www\.|^m\./, ''), p = x.pathname, m;
    if (/\.(mp4|webm|mov|m4v|ogg)$/i.test(p)) return { t:'file' };
    if (h === 'youtu.be') return yt(p.slice(1));
    if (h === 'youtube.com') {
      if (p === '/watch') return yt(x.searchParams.get('v'));
      m = /^\/(shorts|embed|live|v)\/([\w-]{6,})/.exec(p); if (m) return yt(m[2]);
    }
    if (h === 'vimeo.com' && (m = /\/(\d{6,})/.exec(p))) return { t:'embed', src:'https://player.vimeo.com/video/' + m[1] + '?autoplay=1&muted=1&loop=1&playsinline=1' };
    if (h === 'tiktok.com' && (m = /\/video\/(\d+)/.exec(p))) return { t:'embed', src:'https://www.tiktok.com/embed/v2/' + m[1] };
    if (h === 'facebook.com' || h === 'fb.watch') return { t:'embed', src:'https://www.facebook.com/plugins/video.php?href=' + encodeURIComponent(x.href) + '&show_text=false&autoplay=true&mute=1' };
    if (h === 'instagram.com' && (m = /^\/(reel|p|tv)\/([\w-]+)/.exec(p))) return { t:'embed', src:'https://www.instagram.com/' + m[1] + '/' + m[2] + '/embed' };
    return { t:'link', href:x.href };
  }

  var lazy = null;
  function lazyObs(){
    if (lazy) return lazy;
    lazy = new IntersectionObserver(function(es){
      es.forEach(function(e){
        var f = e.target, s = f.getAttribute('data-src');
        if (e.isIntersecting) { if (s && f.getAttribute('src') !== s) f.setAttribute('src', s); }
        else if (f.getAttribute('src')) f.removeAttribute('src');
      });
    }, { threshold: 0.55 });
    return lazy;
  }

  function convertVideo(v){
    if (v.getAttribute('data-vx')) return;
    var src = v.getAttribute('src'); if (!src) return;
    v.setAttribute('data-vx', '1');
    var info = parseVid(src);
    if (info.t === 'file') return;
    var inCard = !!v.closest('.video-card');
    var el;
    if (info.t === 'embed') {
      el = document.createElement('iframe');
      el.className = 'vx-embed';
      el.setAttribute('data-src', info.src);
      el.setAttribute('allow', 'autoplay; encrypted-media; picture-in-picture; fullscreen');
      el.setAttribute('allowfullscreen', '');
      el.setAttribute('referrerpolicy', 'strict-origin-when-cross-origin');
      el.setAttribute('data-vx', '1');
      lazyObs().observe(el);
    } else {
      el = document.createElement('div');
      el.className = 'vx-linkcard';
      el.setAttribute('data-vx', '1');
      el.innerHTML = '<div style="font-size:44px">▶️</div><div style="font-size:14px;opacity:.85">This video plays in another app</div><a target="_blank" rel="noopener">Watch video</a>';
      el.querySelector('a').href = info.href;
      el.querySelector('a').onclick = function(e){ e.stopPropagation(); };
    }
    el.style.cssText += inCard
      ? ';position:absolute;inset:0;width:100%;height:100%;border:0'
      : ';width:100%;aspect-ratio:1/1;border:0;border-radius:10px';
    v.replaceWith(el);
  }

  /* ---- count views / reposts (for the heart goals) ---- */
  var seen = {}, viewIO = null;
  function trackCard(card){
    if (card.getAttribute('data-vxv')) return;
    card.setAttribute('data-vxv', '1');
    var m = /listing\/([^'"]+)/.exec(card.getAttribute('onclick') || ''); if (!m) return;
    var id = m[1], t = null;
    if (!viewIO) viewIO = new IntersectionObserver(function(es){
      es.forEach(function(e){
        var c = e.target, lid = c.getAttribute('data-vxid');
        if (e.isIntersecting) {
          if (seen[lid]) return;
          c._t = setTimeout(function(){ seen[lid] = 1; try { if (VN()) { VXN.view(lid); return; } ensure(); db.viewCount[lid] = (db.viewCount[lid] || 0) + 1; saveDB(); } catch (x) {} }, 2000);
        } else clearTimeout(c._t);
      });
    }, { threshold: 0.6 });
    card.setAttribute('data-vxid', id);
    viewIO.observe(card);
  }

  function scan(root){
    if (!root || root.nodeType !== 1) return;
    if (root.matches && root.matches('video')) convertVideo(root);
    if (root.querySelectorAll) {
      root.querySelectorAll('video[src]').forEach(convertVideo);
      root.querySelectorAll('.video-card').forEach(trackCard);
    }
  }
  new MutationObserver(function(ms){
    ms.forEach(function(m){ m.addedNodes.forEach(scan); });
  }).observe(document.body, { childList:true, subtree:true });
  scan(document.body);

  var _hs = window.homeShare;
  if (typeof _hs === 'function') window.homeShare = function(id){
    try { if (VN()) VXN.share(id); else { ensure(); db.shareCount[id] = (db.shareCount[id] || 0) + 1; saveDB(); } } catch (e) {}
    return _hs.apply(this, arguments);
  };

  /* =====================  4. SELLER-ONLY AREA CHATS / LIVE, AUTO-FOLLOW ADMIN  ===================== */
  var _vja = window.vxJoinArea;
  if (typeof _vja === 'function') window.vxJoinArea = function(nameArg){
    var u = me(); if (!u) return;
    if (!isAdminU(u)) {
      if (!isSeller(u)) return toast('Area group chats are only for sellers who have a property in that area.', 'err');
      var el = document.getElementById('vx-area-in');
      var name = String(nameArg || (el && el.value) || '').trim().toLowerCase();
      if (name) {
        var ok = name.length >= 3 && db.listings.some(function(l){
          return l.sellerId === u.id && [l.lga, l.state, l.address].join(' ').toLowerCase().indexOf(name) > -1;
        });
        if (!ok) return toast('You need a property listed in "' + name + '" to join this group.', 'err');
      }
    }
    return _vja.apply(this, arguments);
  };
  var _rcl = window.renderChatList;
  if (typeof _rcl === 'function') window.renderChatList = function(){
    var r = _rcl.apply(this, arguments);
    try {
      var u = me(), inp = document.getElementById('vx-area-in');
      if (inp && u && !isSeller(u) && !isAdminU(u)) {
        var box = inp.closest('.vx-cbox');
        if (box) box.innerHTML = '<b>📍 Area group chats</b><p style="font-size:13px;color:var(--ink3);margin-top:6px">Only sellers who have a property in an area can join its group chat. Switch to Seller in Settings to post a property.</p>';
      }
    } catch (e) {}
    return r;
  };

  var _live = window.startLiveStream;
  if (typeof _live === 'function') window.startLiveStream = function(){
    var u = me();
    if (u && !isSeller(u) && !isAdminU(u)) { toast('Only sellers can go live for now. Switch to Seller in Settings.', 'err'); return; }
    return _live.apply(this, arguments);
  };

  function ensureAdminFollow(){
    ensure();
    var ch = false;
    db.users.forEach(function(u){
      if (isSeller(u) && !db.follows.some(function(f){ return f.followerId === u.id && f.sellerId === ADMIN; })) { db.follows.push({ followerId:u.id, sellerId:ADMIN }); ch = true; }
    });
    return ch;
  }
  var _sv = window.saveDB;
  window.saveDB = function(){
    try { ensureAdminFollow(); } catch (e) {}
    return _sv.apply(this, arguments);
  };
  var _tf = window.toggleFollow;
  if (typeof _tf === 'function') window.toggleFollow = function(id){
    var u = me();
    if (id === ADMIN && isSeller(u)) { toast('Sellers follow the admin automatically and cannot unfollow.'); return; }
    return _tf.apply(this, arguments);
  };
  try { if (ensureAdminFollow()) saveDB(); } catch (e) {}

  /* =====================  5. HEARTS  ===================== */
  function listingOf(id){ return (db.listings || []).find(function(l){ return l.id === id; }); }
  function heartsOnListing(id){ if (VN()) return VXN.stat(id, 'hearts'); ensure(); return db.hearts.filter(function(h){ return h.listingId === id; }).length; }
  function statsOf(sid){
    if (VN()) { var q = VXN.seller(sid); return { views:q.views||0, reposts:q.shares||0, comments:q.comments||0, likes:q.likes||0, hearts:q.hearts||0, followers:q.followers||0 }; }
    ensure();
    var ls = db.listings.filter(function(l){ return l.sellerId === sid; }), ids = {}, views = 0, shares = 0;
    ls.forEach(function(l){ ids[l.id] = 1; views += db.viewCount[l.id] || 0; shares += db.shareCount[l.id] || 0; });
    return {
      views: views, reposts: shares, comments: (db.vxComments || []).filter(function(c){ return ids[c.listingId]; }).length,
      followers: db.follows.filter(function(f){ return f.sellerId === sid; }).length,
      likes: db.likes.filter(function(x){ return ids[x.listingId]; }).length,
      hearts: db.hearts.filter(function(h){ return ids[h.listingId]; }).length
    };
  }
  /* the admin earns 1 heart for every video posted and every like (plus hearts given) */
  function adminHearts(){
    if (VN()) return VXN.admin();
    ensure();
    return db.listings.filter(function(l){ return l.video; }).length + db.likes.length + db.hearts.length;
  }
  function heartsFor(id){ return id === ADMIN ? adminHearts() : statsOf(id).hearts; }

  function fx(){
    var d = document.createElement('div'); d.className = 'vx-heartfx';
    d.innerHTML = '<svg viewBox="0 0 100 120"><use href="#vxHeart"/></svg><b>You gave a Heart</b>';
    document.body.appendChild(d);
    try { if (navigator.vibrate) navigator.vibrate([60, 40, 60]); } catch (e) {}
    setTimeout(function(){ d.remove(); }, 2000);
  }

  function giveHeart(id){
    var u = me();
    if (!u) { location.hash = '#/auth'; return; }
    var l = listingOf(id); if (!l) return;
    ensure();
    if (l.sellerId === u.id) return toast('You cannot give a heart to your own video.');
    if (VN()) {
      if (VXN.mine('hearts', id)) return toast('You already gave this video a heart.');
      VXN.heart(id).then(function(){ fx(); refreshHearts(); }).catch(function(e){ console.warn('heart', e); toast('Could not save the heart. Check the Firestore rules.', 'err'); });
      return;
    }
    if (db.hearts.some(function(h){ return h.fromId === u.id && h.listingId === id; })) return toast('You already gave this video a heart.');
    db.hearts.push({ fromId:u.id, listingId:id, ts:Date.now() });
    try { if (typeof _isLiked === 'function' && !_isLiked(id) && typeof homeLike === 'function') homeLike(id); } catch (e) {}
    saveDB();
    fx();
    refreshHearts();
  }

  var hold = null, supp = false, curBtn = null;
  function cancelHold(){
    clearTimeout(hold); hold = null;
    if (curBtn) { curBtn.classList.remove('vx-holding'); curBtn = null; }
  }
  document.addEventListener('pointerdown', function(e){
    var b = e.target.closest && e.target.closest('.vs-btn[id^="like-"]'); if (!b) return;
    cancelHold(); curBtn = b; b.classList.add('vx-holding');
    hold = setTimeout(function(){
      var id = b.id.slice(5); cancelHold(); supp = true; giveHeart(id);
      setTimeout(function(){ supp = false; }, 900);
    }, 2000);
  }, true);
  ['pointerup', 'pointercancel'].forEach(function(t){ document.addEventListener(t, cancelHold, true); });
  document.addEventListener('contextmenu', function(e){ if (e.target.closest && e.target.closest('.vs-btn[id^="like-"]')) e.preventDefault(); }, true);
  document.addEventListener('click', function(e){
    if (supp && e.target.closest && e.target.closest('.vs-btn[id^="like-"]')) { e.stopPropagation(); e.preventDefault(); supp = false; }
  }, true);

  function refreshHearts(){
    try {
      ensure();
      var u = me();
      document.querySelectorAll('.vs-btn[id^="like-"]').forEach(function(b){
        var id = b.id.slice(5), mine = !!u && (VN() ? VXN.mine('hearts', id) : db.hearts.some(function(h){ return h.fromId === u.id && h.listingId === id; }));
        var c = b.querySelector('.vs-circle');
        if (c) {
          if (mine) { if (!c.querySelector('svg')) c.innerHTML = H(22, 26); }
          else if (c.querySelector('svg')) c.textContent = (typeof _isLiked === 'function' && _isLiked(id)) ? '❤️' : '🤍';
        }
        var n = heartsOnListing(id), hn = b.querySelector('.vx-hn');
        if (n > 0) {
          if (!hn) { hn = document.createElement('span'); hn.className = 'vx-hn'; b.appendChild(hn); }
          var html = H(11, 13) + n; if (hn.innerHTML !== html) hn.innerHTML = html;
        } else if (hn) hn.remove();
      });
    } catch (e) {}
  }
  setInterval(refreshHearts, 1200);
  window.vxRefreshHearts = refreshHearts;

  /* ---- profile page: hearts, goals, Saved ---- */
  function goalRow(label, v, g){
    var pct = Math.min(100, v * 100 / g);
    return '<div class="vx-goal"><div class="r"><span>' + label + '</span><span>' + nf(v) + ' / ' + nf(g) + '</span></div><div class="bar"><i style="width:' + Math.max(pct, v > 0 ? 1 : 0) + '%"></i></div></div>';
  }
  function payoutHtml(st, hearts){
    if (!VN()) return '<div class="note">Payout requests work on the online site.</div>';
    var ok = st.views >= GOALS.views && st.followers >= GOALS.followers && st.likes >= GOALS.likes && st.comments >= GOALS.comments && st.reposts >= GOALS.reposts && hearts >= 10;
    var pays = VXN.payouts(), ks = Object.keys(pays), pend = ks.some(function(k){ return pays[k].status === 'pending'; }), paid = ks.filter(function(k){ return pays[k].status === 'paid'; }).length;
    var h = '';
    if (paid) h += '<div class="note">Paid payouts: ' + paid + '</div>';
    if (pend) return h + '<div class="note">⏳ Payout request sent. The admin will check it.</div>';
    return h + (ok ? '<button class="btn btn-gold btn-full" style="margin-top:10px" onclick="closeModal();vxPayout()">Request payout</button>' : '<div class="note">The payout button appears when every goal is reached.</div>');
  }
  function decorate(id){
    var modal = document.querySelector('#modal-root .modal'); if (!modal || modal.querySelector('.vx-rw, .vx-crown')) return;
    var u = me(), own = !!u && u.id === id, s = userById(id);
    var hearts = heartsFor(id);
    var stats = modal.querySelector('.sp-stats');
    if (stats) {
      stats.style.gridTemplateColumns = 'repeat(4,1fr)';
      stats.insertAdjacentHTML('beforeend', '<div class="sp-stat"><div class="n">' + nf(hearts) + '</div><div class="l">Hearts</div></div>');
    }
    var h4 = Array.prototype.slice.call(modal.querySelectorAll('h4')).filter(function(x){ return /Videos/.test(x.textContent); })[0];
    var html = '';
    if (id === ADMIN) html += '<div class="vx-crown">👑 Admin · most hearts on Veritas</div>';
    if (own && !isAdminU(u)) html += '<button class="btn btn-gold btn-full" style="margin-bottom:14px" onclick="closeModal();location.hash=\'#/saved\'"><span class="vx-savedico"></span>Saved properties (' +
      (db.saved || []).filter(function(x){ return x.userId === u.id; }).length + ')</button>';
    if (own && isSeller(u)) {
      var st = statsOf(id);
      html += '<div class="vx-rw"><div class="t">' + H(16, 19) + ' Heart rewards</div><div class="big">' + H(24, 29) + nf(hearts) + ' hearts</div>' +
        '<div class="sub">10 hearts = 0.001 LNX coin ≈ $1</div>' +
        goalRow('Views', st.views, GOALS.views) + goalRow('Followers', st.followers || 0, GOALS.followers) + goalRow('Likes', st.likes, GOALS.likes) + goalRow('Comments', st.comments, GOALS.comments) + goalRow('Reposts', st.reposts, GOALS.reposts) +
        '<div class="note">Reach all five goals to start receiving heart payments.</div>' + payoutHtml(st, hearts) + '</div>';
    }
    if (own && isAdminU(u)) html += '<div class="vx-rw"><div class="t">' + H(16, 19) + ' Admin hearts</div><div class="big">' + H(24, 29) + nf(hearts) + ' hearts</div><div class="sub">1 heart for every video posted and every like.</div></div>';
    if (html && h4) h4.insertAdjacentHTML('beforebegin', html);
  }
  var _osp = window.openSellerProfile;
  if (typeof _osp === 'function') window.openSellerProfile = function(id){
    var r = _osp.apply(this, arguments);
    try { decorate(id); } catch (e) { console.warn('profile', e); }
    return r;
  };

  /* ---- Admin Room: hearts card ---- */
  var _rad = window.renderAdminDash;
  if (typeof _rad === 'function') window.renderAdminDash = function(){
    var r = _rad.apply(this, arguments);
    try {
      var app = document.getElementById('app'), box = app && app.firstElementChild;
      if (box && (location.hash || '') === '#/admin' && !document.getElementById('vx-ahearts')) {
        box.insertAdjacentHTML('afterbegin', '<div id="vx-ahearts" class="vx-rw" style="margin-top:12px"><div class="t">👑 Admin hearts</div><div class="big">' + H(26, 31) + nf(adminHearts()) + '</div><div class="sub">1 heart for every video posted and every like on Veritas.</div></div>');
      }
    } catch (e) { console.warn(e); }
    return r;
  };
})();
</script>

<!-- ============================================================

   2. LIKES, HEARTS, VIEWS, REPOSTS, FOLLOWERS and COMMENTS are now counted in the
      cloud (Firebase), the same for everyone. Firestore RULES do the checking, so a
