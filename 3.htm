        if(user.accountType==='seller'&&typeof showSellerStarPopup==='function')showSellerStarPopup(user.stars);
        location.hash='#/dashboard';
      }else{
        const side=user.accountType==='seller'?'seller':'buyer';
        if(!user.emailVerified){issueAndSendCode(user);location.hash='#/auth/'+side+'/code';}
        else location.hash='#/auth/'+side+'/kyc';
      }
    }catch(e){alert(authMsg(e));}
    finally{VXC.signingUp=false;}
  };

  const _prevLogout=window.logout;
  window.logout=function(){
    if(!VXC.on)return _prevLogout();
    const done=function(){
      db.session=null;
      scrubPrivateLocal();
      writeLocal();
      toast('Signed out');
      location.hash='#/';
    };
    Promise.resolve(VXC.auth.signOut()).then(done,done);
  };

  const _prevQuick=window.quickLogin;
  window.quickLogin=function(email){
    if(!VXC.on)return _prevQuick(email);
    toast('Demo accounts are switched off on the live site.','err');
  };

  const _prevKYC=window.submitAdvancedKYC;
  window.submitAdvancedKYC=async function(){
    if(!VXC.on)return _prevKYC();
    const billFile=document.getElementById('bill-upload').files[0];
    const selfieFile=document.getElementById('selfie-upload').files[0];
    const bankName=document.getElementById('bank-name').value.trim();
    const bankAcct=document.getElementById('bank-acct').value.trim();
    if(!billFile||!selfieFile||!bankName||!bankAcct)return alert("Please fill all fields and upload both files.");
    const btn=document.getElementById('kyc-btn');
    btn.innerText="Compressing & Sending...";
    const bill=await resizeImage(billFile,800,0.7);
    const selfie=await resizeImage(selfieFile,800,0.7);
    if(bill.length>650000||selfie.length>650000){
      btn.innerText='Submit For Review →';
      return alert("That file is too large. Please use a photo, or a PDF under 450 KB.");
    }
    const u=me();
    u.kycBillImage=bill;u.kycBillType=billFile.type;u.kycSelfieImage=selfie;
    u.bankName=bankName;u.bankAccount=bankAcct;
    u.kycStatus='pending_review';
    saveDB();
    sendAdminNotification(u,bill,selfie);
    location.hash='#/auth/pending';
  };

  /* Approving someone no longer signs YOU in as them */
  const _prevApprove=window.approveUser;
  window.approveUser=function(id){
    if(!VXC.on)return _prevApprove(id);
    const u=db.users.find(x=>x.id===id);
    if(!u)return;
    u.kycStatus='verified';
    saveDB();
    toast('Approved: '+u.name,'ok');
    renderAdminDash();
  };

  /* ---------- Start ---------- */
  function load(src){
    return new Promise(function(res,rej){
      const s=document.createElement('script');
      s.src=src;s.onload=res;s.onerror=function(){rej(new Error('Could not load '+src));};
      document.head.appendChild(s);
    });
  }

  (async function boot(){
    try{
      await load(SDK+'firebase-app-compat.js');
      await load(SDK+'firebase-auth-compat.js');
      await load(SDK+'firebase-firestore-compat.js');
      firebase.initializeApp(FB_CONFIG);
      VXC.auth=firebase.auth();
      VXC.fs=firebase.firestore();
    }catch(e){
      console.warn('Veritas cloud is not available, using this device only.',e);
      return;
    }
    VXC.on=true;
    document.body.classList.add('vx-cloud');
    if(!db.cloudClean){
      db.users=db.users.filter(u=>u.id==='owner');
      db.listings=[];db.inspections=[];db.reviews=[];db.saved=[];db.chats=[];
      db.cloudClean=true;
    }
    db.session=null;
    writeLocal();
    startPublic();
    VXC.auth.onAuthStateChanged(onAuth);
    rerender();
  })();
})();
</script>


<!-- ============================================================
  NEW ADDITION: SECURITY FIXES (added only, nothing above was edited or removed)

  1. ADMIN GATE
     - Admin Room and all approve / reject buttons now check that you are
       really the signed-in admin (not just a value saved on the phone).
     - The admin email must be verified. A verification link is sent
       automatically the first time the admin signs in.
     - The real lock is in firestore.rules (paste it in Firebase Console >
       Firestore Database > Rules). This block only fixes the screens.
  2. KYC DATA
     - Documents are no longer attached to the admin email.
     - Bank account number is masked in that email.
     - Documents are deleted after you approve or reject (switch below).
     - Documents are removed from the phone once they reached the cloud.
     - Other people's documents are never saved in the phone's storage.
  3. OFFLINE / DEMO MODE PASSWORDS
     - Passwords are salted + hashed (10,000 rounds). Plain text is never saved.
     - Old plain-text passwords are converted automatically on first open.
     - 5 wrong tries locks that email for 5 minutes.
     - Demo accounts and quick-login are switched off on https addresses.
============================================================ -->
<script>
(function(){
  'use strict';

  /* ---------- Switches you can change ---------- */
  var KYC_PURGE_AFTER_DECISION = true;   /* true = delete NEPA bill + selfie after approve/reject */
  var ROUNDS   = 10000;                  /* password hash rounds */
  var MAX_TRIES = 5;                     /* wrong passwords before lock */
  var LOCK_MS   = 5*60*1000;             /* lock time: 5 minutes */

  var isHttp = /^https?:$/.test(location.protocol);
  function cloudOn(){ return !!(window.VXC && VXC.on); }

  /* ---------- Who is really the admin ---------- */
  function adminOk(){
    if (isHttp) return cloudOn() && !!VXC.admin && !!db.session && db.session === 'owner';
    var u = me();
    return !!u && u.id === 'owner';
  }

  /* =========================================================
     3. PASSWORD HASHING (works on file:// pages too)
     ========================================================= */
  var K = [], H0 = [];
  (function(){
    var primes = [], n = 2, i;
    while (primes.length < 64) {
      var ok = true;
      for (i = 0; i < primes.length; i++) {
        if (primes[i] * primes[i] > n) break;
        if (n % primes[i] === 0) { ok = false; break; }
      }
      if (ok) primes.push(n);
      n++;
    }
    function frac(x){ return Math.floor((x - Math.floor(x)) * 4294967296) >>> 0; }
    for (i = 0; i < 64; i++) K[i] = frac(Math.cbrt(primes[i]));
    for (i = 0; i < 8; i++) H0[i] = frac(Math.sqrt(primes[i]));
  })();

  function ror(x, n){ return (x >>> n) | (x << (32 - n)); }

  function sha256(bytes){
    var l = bytes.length;
    var padLen = ((l + 9 + 63) >> 6) << 6;
    var m = new Uint8Array(padLen);
    m.set(bytes);
    m[l] = 0x80;
    var dv = new DataView(m.buffer);
    dv.setUint32(padLen - 8, Math.floor(l / 536870912));
    dv.setUint32(padLen - 4, (l << 3) >>> 0);
    var h = H0.slice(), w = new Array(64), i;
    for (var off = 0; off < padLen; off += 64) {
      for (i = 0; i < 16; i++) w[i] = dv.getUint32(off + i * 4);
      for (i = 16; i < 64; i++) {
        var s0 = ror(w[i-15], 7) ^ ror(w[i-15], 18) ^ (w[i-15] >>> 3);
        var s1 = ror(w[i-2], 17) ^ ror(w[i-2], 19) ^ (w[i-2] >>> 10);
        w[i] = (w[i-16] + s0 + w[i-7] + s1) | 0;
      }
      var a = h[0], b = h[1], c = h[2], d = h[3], e = h[4], f = h[5], g = h[6], hh = h[7];
      for (i = 0; i < 64; i++) {
        var S1 = ror(e, 6) ^ ror(e, 11) ^ ror(e, 25);
        var ch = (e & f) ^ (~e & g);
        var t1 = (hh + S1 + ch + K[i] + w[i]) | 0;
        var S0 = ror(a, 2) ^ ror(a, 13) ^ ror(a, 22);
        var mj = (a & b) ^ (a & c) ^ (b & c);
        var t2 = (S0 + mj) | 0;
        hh = g; g = f; f = e; e = (d + t1) | 0; d = c; c = b; b = a; a = (t1 + t2) | 0;
      }
      h[0] = (h[0] + a) | 0; h[1] = (h[1] + b) | 0; h[2] = (h[2] + c) | 0; h[3] = (h[3] + d) | 0;
      h[4] = (h[4] + e) | 0; h[5] = (h[5] + f) | 0; h[6] = (h[6] + g) | 0; h[7] = (h[7] + hh) | 0;
    }
    var out = new Uint8Array(32), ov = new DataView(out.buffer);
    for (i = 0; i < 8; i++) ov.setUint32(i * 4, h[i] >>> 0);
    return out;
  }

  function hex(u8){
    var s = '';
    for (var i = 0; i < u8.length; i++) s += (u8[i] < 16 ? '0' : '') + u8[i].toString(16);
    return s;
  }

  function hashPw(pw, salt){
    var enc = new TextEncoder();
    var pwb = enc.encode(pw);
    var h = sha256(enc.encode(salt + ':' + pw));
    for (var i = 0; i < ROUNDS; i++) {
      var m = new Uint8Array(h.length + pwb.length);
      m.set(h); m.set(pwb, h.length);
      h = sha256(m);
    }
    return hex(h);
  }

  function newSalt(){
    var a = new Uint8Array(12);
    try { crypto.getRandomValues(a); }
    catch (e) { for (var i = 0; i < 12; i++) a[i] = Math.floor(Math.random() * 256); }
    return hex(a);
  }

  function safeEq(a, b){
    if (typeof a !== 'string' || typeof b !== 'string' || a.length !== b.length) return false;
    var r = 0;
    for (var i = 0; i < a.length; i++) r |= a.charCodeAt(i) ^ b.charCodeAt(i);
    return r === 0;
  }

  window.vxSha256Hex = function(s){ return hex(sha256(new TextEncoder().encode(String(s)))); };

  /* Turn any saved plain-text password into a salted hash */
  function hashLegacy(){
    var changed = false;
    (db.users || []).forEach(function(u){
      if (typeof u.password === 'string' && u.password) {
        var salt = newSalt();
        u.passSalt = salt;
        u.passHash = hashPw(u.password, salt);
        u.passRounds = ROUNDS;
        delete u.password;
        changed = true;
      }
    });
    return changed;
  }

  /* Every save first converts passwords, so plain text never reaches storage */
  var _saveDB = window.saveDB;
  window.saveDB = function(){
    try { hashLegacy(); } catch (e) { console.warn('password hashing', e); }
    return _saveDB.apply(this, arguments);
  };

  /* Last line of defence at the storage door:
     - never store a plain-text password
     - in cloud mode, never store other people's KYC documents on this phone */
  try {
    var _setItem = Storage.prototype.setItem;
    Storage.prototype.setItem = function(k, v){
      if (k === DB_KEY && typeof v === 'string') {
        try {
          var o = JSON.parse(v);
          (o.users || []).forEach(function(u){
            delete u.password;
            if (cloudOn() && u.id !== o.session) {
              delete u.kycBillImage; delete u.kycSelfieImage; delete u.kycBillType;
            }
          });
          v = JSON.stringify(o);
        } catch (e) {}
      }
      return _setItem.call(this, k, v);
    };
  } catch (e) {}

  /* ---------- Offline login: checks the hash, locks after 5 wrong tries ---------- */
  var tries = {};
  var _prevLogin = window.loginUser;
  window.loginUser = async function(){
    if (cloudOn()) return _prevLogin.apply(this, arguments);
    var emailEl = document.getElementById('login-email');
    var passEl  = document.getElementById('login-pass');
    if (!emailEl || !passEl) return _prevLogin.apply(this, arguments);
    var email = emailEl.value.trim().toLowerCase();
    var pass  = passEl.value;
    if (!email || !pass) return alert('Please enter email and password');

    /* the admin email keeps its own code-by-email flow */
    if (email === vxAdminMail().toLowerCase()) return _prevLogin.apply(this, arguments);

    var t = tries[email] || { n: 0, until: 0 };
    if (Date.now() < t.until) return alert('Too many wrong attempts. Try again in a few minutes.');

    var user = db.users.find(function(u){ return u.email && u.email.toLowerCase() === email; });
    if (user && isHttp && ['u1','u2','u3','u4'].indexOf(user.id) > -1) {
      return alert('Demo accounts are switched off on the live site.');
    }

    var ok = false;
    if (user && user.passHash && user.passSalt) ok = safeEq(hashPw(pass, user.passSalt), user.passHash);
    if (!ok) {
      t.n++;
      if (t.n >= MAX_TRIES) { t.until = Date.now() + LOCK_MS; t.n = 0; }
      tries[email] = t;
      return alert('Invalid email or password.');
    }
    tries[email] = { n: 0, until: 0 };

    db.session = user.id; saveDB();
    toast('Welcome back, ' + user.name.split(' ')[0], 'ok');
    if (user.kycStatus === 'pending_review') {
      location.hash = '#/auth/pending';
    } else if (user.kycStatus === 'verified') {
      if (user.accountType === 'seller') showSellerStarPopup(user.stars);
      location.hash = '#/dashboard';
    } else {
      var side = user.accountType === 'seller' ? 'seller' : 'buyer';
      if (!user.emailVerified && !user.verified) { issueAndSendCode(user); location.hash = '#/auth/' + side + '/code'; }
      else location.hash = '#/auth/' + side + '/kyc';
    }
  };

  /* Quick-login (no password at all) only works on a file / demo, never on a web address */
  var _prevQuick = window.quickLogin;
  window.quickLogin = function(email){
    if (isHttp) { toast('Demo accounts are switched off on the live site.', 'err'); return; }
    return _prevQuick.apply(this, arguments);
  };

  /* =========================================================
     1. ADMIN GATE
     ========================================================= */
  var waiting = false;
  function waitForAdmin(n){
    if ((location.hash || '') !== '#/admin') { waiting = false; return; }
    if (adminOk()) { waiting = false; router(); return; }
    if (n >= 20) { waiting = false; toast('Not allowed', 'err'); location.hash = '#/'; return; }
    setTimeout(function(){ waitForAdmin(n + 1); }, 400);
  }

  var _renderAdminDash = window.renderAdminDash;
  window.renderAdminDash = function(){
    if (adminOk()) return _renderAdminDash.apply(this, arguments);
    if (isHttp) {
      var app = document.getElementById('app');
      if (app) app.innerHTML = '<div class="empty" style="padding:60px 20px"><div class="big">🔐</div><h3>Checking admin access…</h3></div>';
      if (!waiting) { waiting = true; waitForAdmin(0); }
      return;
    }
    toast('Not allowed', 'err');
    location.hash = '#/';
  };

  function guard(name, after){
    var f = window[name];
    if (typeof f !== 'function') return;
    window[name] = function(id){
      if (!adminOk()) { toast('Not allowed', 'err'); return; }
      var r = f.apply(this, arguments);
      if (after) { try { after(id); } catch (e) { console.warn(e); } }
      return r;
    };
  }

  /* =========================================================
     2. KYC DATA
     ========================================================= */
  function purgeKyc(id){
    if (!KYC_PURGE_AFTER_DECISION) return;
    var u = db.users.find(function(x){ return x.id === id; });
    if (u) { delete u.kycBillImage; delete u.kycSelfieImage; delete u.kycBillType; }
    if (cloudOn() && VXC.admin) {
      VXC.fs.collection('kyc').doc(id).delete().catch(function(e){ console.warn('kyc purge', e); });
    }
    try { saveDB(); } catch (e) {}
  }

  guard('approveUser', purgeKyc);
  guard('rejectUser', purgeKyc);
  guard('approvePayment');
  guard('rejectPayment');

  /* Admin email: no documents attached, account number masked */
  window.sendAdminNotification = async function(user){
    var c = db.emailConfig;
    try {
      emailjs.init({ publicKey: c.publicKey });
      var acct = String(user.bankAccount || '');
      await emailjs.send(c.serviceId, c.templateId, {
        to_email: vxAdminMail(),
        name: 'KYC REVIEW NEEDED: ' + user.name,
        email: user.email,
        bank_details: (user.bankName || '') + ' | ****' + acct.slice(-4),
        bill_image: '',
        selfie_image: '',
        code: '-',
        app_name: 'Veritas',
        note: 'Documents are not attached. Open the Admin Room to review them.'
      });
    } catch (e) { console.log('EmailJS Error: ', e); }
  };

  /* After the documents reached the cloud, remove them from this phone */
  function scrubWhenUploaded(id, n){
    if (n > 40 || !cloudOn()) return;
    var again = function(){ setTimeout(function(){ scrubWhenUploaded(id, n + 1); }, 3000); };
    VXC.fs.collection('kyc').doc(id).get({ source: 'server' }).then(function(s){
      if (s.exists) {
        var u = db.users.find(function(x){ return x.id === id; });
        if (u) { delete u.kycBillImage; delete u.kycSelfieImage; delete u.kycBillType; saveDB(); }
      } else again();
    }).catch(again);
  }
  var _prevKYC = window.submitAdvancedKYC;
  window.submitAdvancedKYC = async function(){
    var r = await _prevKYC.apply(this, arguments);
    try {
      if (cloudOn()) { var u = me(); if (u && u.id !== 'owner') scrubWhenUploaded(u.id, 0); }
    } catch (e) {}
    return r;
  };

  /* ---------- Admin email must be verified (the rules check it too) ---------- */
  function whenAuthReady(cb, n){
    n = n || 0;
    if (window.VXC && VXC.auth) { cb(); return; }
    if (n > 60) return;
    setTimeout(function(){ whenAuthReady(cb, n + 1); }, 500);
  }
  whenAuthReady(function(){
    VXC.auth.onAuthStateChanged(function(fb){
      if (!fb) return;
      if (String(fb.email || '').toLowerCase() !== vxAdminMail().toLowerCase()) return;
      if (fb.emailVerified) return;
      try {
        if (sessionStorage.getItem('vx_adm_ver')) return;
        sessionStorage.setItem('vx_adm_ver', '1');
      } catch (e) {}
      fb.sendEmailVerification().then(function(){
        toast('Admin email is not verified. A link was sent to ' + fb.email + '. Open it, then sign in again.', 'err');
      }).catch(function(){});
    });
  });

  /* ---------- Convert any old plain-text passwords right now ---------- */
  try { if (hashLegacy()) saveDB(); } catch (e) { console.warn('password hashing', e); }
})();
</script>
